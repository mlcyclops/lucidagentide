<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- P-THEME.1: both schemes are supported now (desktop/renderer/theme.ts + the [data-theme] blocks in
       styles.css), so the UA may paint light form controls, scrollbars and caret when a light theme is
       active. Each theme block also sets `color-scheme` itself; this meta is the pre-CSS default.
       NOTE: the theme attribute is set on <html> by app.js as its very first statement, from a
       localStorage mirror of the persisted choice. It CANNOT be an inline <script> here, because the CSP
       below allows script-src 'self' only. The base :root in styles.css therefore also answers
       prefers-color-scheme, so a light-OS user's FIRST paint is already light and there is no flash. -->
  <meta name="color-scheme" content="dark light" />
  <!-- font-src adds data: for Monaco's codicon font (inlined as a data:font/ttf URL in its min build);
       worker-src adds blob: for Monaco's language-service workers; media-src adds blob:/data: for the
       locally-synthesized TTS audio (read-aloud + podcast player, decoded to a Blob URL in-renderer).
       All are same-origin-derived and cannot exfiltrate - egress stays locked by connect-src
       'self'/localhost and script-src 'self'. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' http://localhost:* ws://localhost:* https://www.googleapis.com https://securetoken.googleapis.com; script-src 'self'; worker-src 'self' blob:" />
  <title>Lucid Agent</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="tip"></div>
  <div id="scrim"></div>
  <div id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
