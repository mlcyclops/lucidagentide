<!-- Brick Brigade: Rescue Run. An original brick breaker: troops are sealed inside the wall; break them out, catch them, and each branch lends you its power. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BRICK BRIGADE</title>
<style>
:root{--bg:#060a14;--ink:#eef2ff;--dim:#8d97b5;--olive:#b5c46a;--gold:#ffcf5a;--navy:#7fa6ff;--sky:#8fd3ff;--red:#ff5a6a;--panel:rgba(8,13,26,.9)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:none}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(10,16,32,.62);border:1px solid rgba(181,196,106,.28);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 0 14px rgba(181,196,106,.08);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#livesV{color:var(--red)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,207,90,.42);box-shadow:0 0 16px rgba(255,207,90,.12)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--sky);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--olive),var(--gold));box-shadow:0 0 8px rgba(255,207,90,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,207,90,.95);border-color:var(--gold)}100%{box-shadow:0 0 16px rgba(255,207,90,.12)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(10,16,32,.7);border:1px solid rgba(143,211,255,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--sky);box-shadow:0 0 12px rgba(143,211,255,.45);outline:none}
.hbtn[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
@media (max-width:430px){.chip .lbl{display:none}.chip{padding:0 8px}.chip.goal .gn{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:var(--panel);border:1px solid rgba(181,196,106,.35);border-radius:18px;padding:16px 18px 14px;width:min(520px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(181,196,106,.14),0 0 90px rgba(127,166,255,.08),inset 0 0 60px rgba(20,28,56,.6)}
.art{display:flex;justify-content:center;gap:2px;margin:0 auto 2px;min-height:94px}
.art:empty{display:none}
.trooper{display:flex;flex-direction:column;align-items:center;gap:1px;width:76px}
.trooper svg{width:62px;height:75px;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.trooper .tag{font-size:9px;font-weight:900;letter-spacing:.18em;white-space:nowrap}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:4px 0 2px;background:linear-gradient(90deg,var(--olive) 0%,var(--gold) 38%,#ff9a5a 62%,var(--navy) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,207,90,.4))}
h1.bad{background:linear-gradient(90deg,#ff5a6a,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--sky);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#c9d2ef;max-width:52ch;margin:0 auto 8px}
.pitch b{color:var(--gold)}
.powers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:5px;margin:2px 0 8px;text-align:left}
.pw{position:relative;font-size:11.5px;line-height:1.35;color:#c9d2ef;padding:6px 9px 6px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.pw::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.pw b{display:block;font-size:10.5px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--gold);background:rgba(255,207,90,.08);border:1px solid rgba(255,207,90,.45);box-shadow:0 2px 0 rgba(255,207,90,.22)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(127,166,255,.18),rgba(127,166,255,.04));border:1px solid rgba(127,166,255,.5);transition:transform .12s,box-shadow .15s}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(127,166,255,.5);transform:translateY(-1px);outline:none}
.btn.primary{font-size:16px;padding:13px 34px;background:linear-gradient(180deg,rgba(255,207,90,.28),rgba(181,196,106,.08));border-color:rgba(255,207,90,.7);box-shadow:0 0 18px rgba(255,207,90,.28)}
.btn.primary:hover,.btn.primary:focus-visible{box-shadow:0 0 32px rgba(255,207,90,.6)}
#ovStats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:62px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#d9f5a8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
/* the LUCID Preview panel is often wide and short: the panels must fit without scrolling */
@media (max-height:820px){
  .panel{padding:10px 16px 10px}
  .art{min-height:0}
  .trooper svg{width:48px;height:58px}
  .trooper .tag{font-size:8px}
  h1{font-size:clamp(24px,5.6vh,40px);margin:2px 0}
  .sub{margin-bottom:4px}
  .pitch{font-size:12px;line-height:1.4;margin-bottom:6px}
  .pw{font-size:10.5px;padding:4px 8px 4px 11px}
  .ladder li{font-size:10.5px}
  #ovStats .val{font-size:18px}
  .btn.primary{padding:10px 30px;font-size:15px}
  .row2{margin-top:6px}
  .legend{margin-top:4px;line-height:1.8;font-size:10.5px}
}
@media (max-height:600px){.powers,.ladder,.pitch{display:none}.trooper svg{width:40px;height:48px}.trooper{width:64px}h1{font-size:30px}}
@media (max-height:430px){.art{display:none}}
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="Brick Brigade playfield: move the carrier with the pointer or arrow keys"></canvas>
<div id="hud">
  <div class="chip" title="Lives"><span class="lbl">LIVES</span><b id="livesV">3</b></div>
  <div class="chip" title="Wave"><span class="lbl">WAVE</span><b id="waveV">1</b></div>
  <div class="chip" title="Score"><span class="lbl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Break 12 bricks</span><span class="gp" id="goalP">0/12</span><i id="goalFill"></i></div>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P)">II</button>
  <button id="muteBtn" class="hbtn" type="button" aria-label="Mute sound (M)" aria-pressed="false" title="Mute (M)">&#9835;</button>
</div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel">
    <div id="ovArt" class="art"></div>
    <h1 id="ovTitle">BRICK BRIGADE</h1>
    <div id="ovSub" class="sub">Rescue Run</div>
    <p id="ovBody" class="pitch"></p>
    <div id="ovStats"></div>
    <div id="ovExtra"></div>
    <div class="row2"><button id="btnPrimary" class="btn primary" type="button">Deploy</button><button id="btnSecondary" class="btn" type="button" hidden>New run</button></div>
    <div id="ovKeys" class="legend">Drag or <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; Tap or <kbd>Space</kbd> launch &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> mute</div>
  </div>
</div>
<script>
'use strict';
(function () {
  // ─────────────────────────────── basics ───────────────────────────────
  const $ = (id) => document.getElementById(id);
  const W = 360, HUD_H = 46, RS = 3, BALL_R = 6;
  // The field is 360 wide; its height follows the panel: a short, wide Preview gets the compact 500.
  let H = 600, PADDLE_Y = 562, BARRIER_Y = 586, Y0 = 96;
  const cv = $('field');
  const ctx = cv.getContext('2d');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  let vw = 360, vh = 640, dpr = 1, scale = 1, offX = 0, offY = HUD_H;
  let T = 0;

  // ─────────────────────────────── palettes ─────────────────────────────
  const BR = {
    army:   { name: 'ARMY', cry: 'HOOAH!', power: 'FORTIFY', hi: '#c9d77e', mid: '#6b7d3a', sh: '#323d17', glow: '160,200,90', css: '#b5c46a',
              uni: '#6a7c37', uni2: '#4d5b27', leg: '#56662c', pts: 500, blurb: 'Wider carrier plus a sandbag line that saves one ball.' },
    navy:   { name: 'NAVY', cry: 'HOOYAH!', power: 'FLEET', hi: '#a9c3ff', mid: '#2f56c9', sh: '#14245a', glow: '100,150,255', css: '#7fa6ff',
              uni: '#1d3181', uni2: '#142460', leg: '#1d3181', pts: 500, blurb: 'Every ball in play splits into three.' },
    air:    { name: 'AIR FORCE', cry: 'WILCO!', power: 'AIR STRIKE', hi: '#cdeeff', mid: '#5ba4e6', sh: '#244f7c', glow: '130,205,255', css: '#8fd3ff',
              uni: '#5d8fd0', uni2: '#4674b0', leg: '#5d8fd0', pts: 350, blurb: 'A jet bombs the lowest wall. Airmen parachute: easy catch.' },
    marine: { name: 'MARINES', cry: 'OORAH!', power: 'BREACH', hi: '#ff9a9a', mid: '#c8102e', sh: '#5e0715', glow: '255,90,100', css: '#ff6a78',
              uni: '#1a2346', uni2: '#111833', leg: '#3657a8', pts: 800, blurb: 'The ball burns through bricks. Marines dive fast: big bonus.' },
  };
  const BRANCHES = ['army', 'navy', 'air', 'marine'];
  const CODE = { A: 'army', N: 'navy', F: 'air', M: 'marine' };
  const MAT = {
    s: { hp: 1, pts: 40, hi: '#f0dca2', mid: '#c7a466', sh: '#7e6034', glow: '240,200,120' },
    c: { hp: 2, pts: 90, hi: '#d5dae2', mid: '#8e96a4', sh: '#4c535f', glow: '190,200,220' },
    t: { hp: 3, pts: 160, hi: '#eef4fb', mid: '#7a889b', sh: '#333c4a', glow: '160,200,255' },
  };

  // ─────────────────────────────── soldiers as SVG ───────────────────────
  // A pose is limb angles in degrees. Front view: 0 hangs down, 90 is straight out, 180 straight up; the
  // right side mirrors. Side view (the Army march) swings both arms and legs in one plane.
  const POSES = {
    army: {
      idle: [{ side: 1, la: 32, ra: -32, ll: -26, rl: 26 }, { side: 1, la: 12, ra: -12, ll: -9, rl: 9, dy: -0.8 }, { side: 1, la: -32, ra: 32, ll: 26, rl: -26 }, { side: 1, la: -12, ra: 12, ll: 9, rl: -9, dy: -0.8 }],
      fall: [{ la: 150, ra: 118, ll: 34, rl: 8, mouth: 'o' }, { la: 118, ra: 150, ll: 8, rl: 34, mouth: 'o' }],
    },
    navy: {
      idle: [{ la: 135, ra: 45, flags: 1 }, { la: 178, ra: 178, flags: 1 }, { la: 45, ra: 135, flags: 1 }, { la: 92, ra: 92, flags: 1 }],
      fall: [{ la: 38, ra: 38, ll: 10, rl: 10, ring: 1, mouth: 'smile' }, { la: 48, ra: 48, ll: 20, rl: 20, ring: 1, dy: -0.6, mouth: 'smile' }],
    },
    air: {
      idle: [{ la: 92, ra: 92, tilt: -14, scarf: 0 }, { la: 96, ra: 96, tilt: -4, scarf: 1 }, { la: 92, ra: 92, tilt: 14, scarf: 2 }, { la: 96, ra: 96, tilt: 4, scarf: 3 }],
      fall: [{ la: 164, ra: 164, ll: 6, rl: 16, scarf: 0 }, { la: 160, ra: 160, ll: 16, rl: 6, scarf: 2 }],
    },
    marine: {
      idle: [{ la: 8, ra: 8, ll: 3, rl: 3 }, { la: 82, ra: 82, ll: 13, rl: 13, dy: -1.2 }, { la: 168, ra: 168, ll: 24, rl: 24, dy: -2.4 }, { la: 82, ra: 82, ll: 13, rl: 13, dy: -1.2 }],
      fall: [{ la: 172, ra: 168, ll: 3, rl: 6, mouth: 'o' }, { la: 168, ra: 172, ll: 6, rl: 3, mouth: 'o' }],
    },
  };
  const KNOCK = [{ la: 6, ra: 168, mouth: 'o' }, { la: 6, ra: 136, mouth: 'o' }];
  const SALUTE = { la: 6, ra: 148, ll: 4, rl: 4, mouth: 'smile' };

  function soldierSVG(b, frames, dur, px) {
    const f = Array.isArray(frames) ? frames : [frames];
    const p = f[0], anim = f.length > 1, s = BR[b];
    const skin = '#f1c9a0', boot = '#16181d', side = !!p.side;
    const sl = side ? [20, 20] : [14.6, 20.2], sr = side ? [20, 20] : [25.4, 20.2];
    const hl = side ? [20, 31] : [17.6, 31], hr = side ? [20, 31] : [22.4, 31];
    const spline = (n) => Array(n).fill('.45 0 .55 1').join(';');
    const rot = (key, mirror, cx, cy) => {
      const a = (q) => (mirror ? -1 : 1) * (q[key] || 0);
      if (!anim) return { attr: `transform="rotate(${a(p)} ${cx} ${cy})"`, tag: '' };
      const v = f.map((q) => `${a(q)} ${cx} ${cy}`).concat([`${a(f[0])} ${cx} ${cy}`]).join(';');
      return { attr: '', tag: `<animateTransform attributeName="transform" type="rotate" values="${v}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${spline(f.length)}"/>` };
    };
    const limb = (cx, cy, key, mirror, w, len, fill, inner) => {
      const r = rot(key, mirror, cx, cy);
      return `<g ${r.attr}>${r.tag}<rect x="${cx - w / 2}" y="${cy}" width="${w}" height="${len}" rx="${w / 2}" fill="${fill}"/>${inner}</g>`;
    };
    const legG = (cx, cy, key, mirror, shade) => limb(cx, cy, key, mirror, 4.6, 11, shade || s.leg,
      (b === 'marine' ? `<rect x="${cx - 0.6}" y="${cy}" width="1.2" height="9.6" fill="#c8102e"/>` : '') +
      `<rect x="${cx - 2.8}" y="${cy + 9.4}" width="5.6" height="3.2" rx="1.4" fill="${boot}"/>`);
    const flag = (cx, cy) => p.flags ? `<line x1="${cx}" y1="${cy + 10}" x2="${cx}" y2="${cy + 17}" stroke="#3b2a18" stroke-width="0.9"/><rect x="${cx - 0.2}" y="${cy + 13.5}" width="6" height="6" fill="#ffd21f"/><path d="M${cx - 0.2} ${cy + 13.5} h6 L${cx - 0.2} ${cy + 19.5} Z" fill="#e0262e"/>` : '';
    const armG = (cx, cy, key, mirror, shade) => limb(cx, cy, key, mirror, 3.9, 10.6, shade || s.uni, `<circle cx="${cx}" cy="${cy + 11.2}" r="2.1" fill="${skin}"/>` + flag(cx, cy));
    let torso;
    if (side) torso = `<rect x="16.2" y="18" width="7.6" height="14" rx="3" fill="${s.uni}"/><rect x="16.2" y="28.6" width="7.6" height="2" fill="#3a3a26"/><circle cx="19" cy="22" r="1.5" fill="${s.uni2}"/><circle cx="21.5" cy="25.5" r="1.3" fill="#8e9d52"/><rect x="13.4" y="19.5" width="3.4" height="8" rx="1.2" fill="#4a5a26"/>`;
    else if (b === 'army') torso = `<rect x="14" y="18" width="12" height="14" rx="3" fill="${s.uni}"/><ellipse cx="17" cy="21.5" rx="2.2" ry="1.4" fill="${s.uni2}"/><ellipse cx="23" cy="25" rx="2.4" ry="1.5" fill="#8e9d52"/><ellipse cx="18.5" cy="27" rx="1.7" ry="1.1" fill="${s.uni2}"/><rect x="14" y="28.6" width="12" height="2.1" fill="#3a3a26"/><rect x="19" y="28.4" width="2" height="2.5" fill="#b9a15a"/>`;
    else if (b === 'navy') torso = `<rect x="14" y="18" width="12" height="14" rx="3" fill="${s.uni}"/><path d="M14.6 18.2 L20 24.4 L25.4 18.2 Z" fill="#f4f6fb"/><path d="M15.8 18.2 L20 23 L24.2 18.2" fill="none" stroke="${s.uni}" stroke-width=".7"/><path d="M18.4 23.2 L20 26.4 L21.6 23.2 Z" fill="#111"/>`;
    else if (b === 'air') {
      const sc = [0, 1, 2, 3].map((k) => `M22 18.6 Q${27 + k} ${17 + (k % 2)} ${31 + k * 0.6} ${19.5 - (k % 2) * 1.6} Q27.5 20.2 22.4 20.4 Z`);
      const scarf = anim ? `<path d="${sc[0]}" fill="#fff"><animate attributeName="d" values="${sc.concat([sc[0]]).join(';')}" dur="${(dur * 0.6).toFixed(2)}s" repeatCount="indefinite"/></path>` : `<path d="${sc[p.scarf || 0]}" fill="#fff"/>`;
      torso = `<rect x="14" y="18" width="12" height="14" rx="3" fill="${s.uni}"/><line x1="20" y1="19" x2="20" y2="31" stroke="${s.uni2}" stroke-width=".8"/><rect x="21.6" y="21" width="3" height="2.2" rx=".5" fill="#ffcf5a"/><rect x="14" y="28.6" width="12" height="1.8" fill="${s.uni2}"/>` + scarf;
    } else torso = `<rect x="14" y="18" width="12" height="14" rx="3" fill="${s.uni}"/><rect x="14" y="17.8" width="12" height="2.2" rx="1" fill="${s.uni2}"/><circle cx="20" cy="21.5" r=".75" fill="#ffcf5a"/><circle cx="20" cy="24" r=".75" fill="#ffcf5a"/><circle cx="20" cy="26.5" r=".75" fill="#ffcf5a"/><rect x="14" y="28.4" width="12" height="2.1" fill="#f4f6fb"/><rect x="18.9" y="28.2" width="2.2" height="2.5" fill="#ffcf5a"/>`;
    const mx = side ? 22.4 : 20;
    const mouth = p.mouth === 'o' ? `<ellipse cx="${mx}" cy="14.7" rx="1" ry="1.2" fill="#6a2b1d"/>`
      : p.mouth === 'smile' ? `<path d="M${mx - 1.8} 14.2 Q${mx} 16.2 ${mx + 1.8} 14.2" fill="none" stroke="#6a2b1d" stroke-width=".8" stroke-linecap="round"/>`
      : `<path d="M${mx - 1.3} 14.6 Q${mx} 15.4 ${mx + 1.3} 14.6" fill="none" stroke="#6a2b1d" stroke-width=".7" stroke-linecap="round"/>`;
    const eyes = b === 'air' ? '' : side ? `<circle cx="22.6" cy="11.8" r=".8" fill="#1b1b1b"/>`

        if (stage > 0) ctx.drawImage(GLASS_CRACK, -k.w / 2, -k.h / 2, k.w, k.h);
        ctx.save(); ctx.translate(-k.w / 2 + 6, -k.h / 2 + 6); ctx.fillStyle = ctx.strokeStyle = 'rgba(255,255,255,.9)'; insignia(k.branch); ctx.restore();
      } else ctx.drawImage(brickSprite(k.kind, stage), -k.w / 2, -k.h / 2, k.w, k.h);
      if (hit) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,255,255,${(k.hitT / 0.14 * 0.5).toFixed(3)})`; rr(ctx, -k.w / 2, -k.h / 2, k.w, k.h, 4); ctx.fill(); }
      ctx.restore();
    }
  }
  function drawBarrier() {
    if (!S || S.barrier <= 0) return;
    const pop = 1 + Math.sin((G.barrierPop || 0) * Math.PI) * 0.35;
    for (let i = 0; i < S.barrier; i++) {
      const y = BARRIER_Y + 2 + i * 4;
      for (let x = 4; x < W - 4; x += 15) {
        ctx.save(); ctx.translate(x + 7, y); ctx.scale(1, pop);
        const g = ctx.createLinearGradient(0, -3.5, 0, 3.5); g.addColorStop(0, MAT.s.hi); g.addColorStop(1, MAT.s.sh);
        ctx.fillStyle = g; rr(ctx, -7, -3.2, 14, 6.4, 3); ctx.fill(); ctx.restore();
      }
    }
  }
  function drawPaddle() {
    const w = P.w, h = P.h, sq = P.squash, x = P.x, y = PADDLE_Y;
    const sx = 1 + sq * 0.12, sy = 1 - sq * 0.25, wide = P.wideT > 0;
    ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, w * 0.7); gl.addColorStop(0, wide ? 'rgba(255,207,90,.28)' : 'rgba(143,211,255,.2)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl; ctx.fillRect(-w * 0.7, -w * 0.4, w * 1.4, w * 0.8); ctx.restore();
    // treads
    ctx.fillStyle = '#1b1f27'; rr(ctx, -w / 2 + 2, 1, w - 4, h / 2 + 3, 4); ctx.fill();
    ctx.fillStyle = '#4a5160';
    for (let k = -w / 2 + 4 + ((-P.tread % 6) + 6) % 6; k < w / 2 - 4; k += 6) ctx.fillRect(k, 3, 2.4, h / 2);
    // hull
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, wide ? '#fff0b8' : '#d9e6c0'); g.addColorStop(0.35, wide ? '#c9a13e' : '#7d8f4a'); g.addColorStop(1, '#2f3a1c');
    ctx.fillStyle = g; rr(ctx, -w / 2, -h / 2 - 2, w, h, 5); ctx.fill();
    ctx.strokeStyle = wide ? 'rgba(255,207,90,.9)' : 'rgba(143,211,255,.85)'; ctx.lineWidth = 1.6; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 5, -h / 2 - 1.5); ctx.lineTo(w / 2 - 5, -h / 2 - 1.5); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '900 7px ui-sans-serif,system-ui,Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RESCUE', 0, -1.5);
    // beacon lights
    const on = Math.sin(T * 10) > 0;
    ctx.fillStyle = on ? '#ff5a6a' : '#5a2028'; ctx.beginPath(); ctx.arc(-w / 2 + 5, -h / 2 + 1, 1.8, 0, 7); ctx.fill();
    ctx.fillStyle = on ? '#5a8aff' : '#1c2a55'; ctx.beginPath(); ctx.arc(w / 2 - 5, -h / 2 + 1, 1.8, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawBalls() {
    const fire = S && S.breachT > 0;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const b of balls) {
      for (let i = 0; i < b.trail.length; i += 2) {
        const a = i / b.trail.length;
        ctx.fillStyle = fire ? `rgba(255,120,60,${(a * 0.45).toFixed(3)})` : `rgba(143,211,255,${(a * 0.35).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(b.trail[i], b.trail[i + 1], BALL_R * (0.4 + a * 0.6), 0, 7); ctx.fill();
      }
      const halo = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, BALL_R * 3.2);
      halo.addColorStop(0, fire ? 'rgba(255,170,90,.55)' : 'rgba(170,225,255,.5)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R * 3.2, 0, 7); ctx.fill();
    }
    ctx.restore();
    for (const b of balls) {
      const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 0.5, b.x, b.y, BALL_R);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, fire ? '#ffc070' : '#bfe9ff'); g.addColorStop(1, fire ? '#ff5a2a' : '#4a8fd8');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 7); ctx.fill();
    }
  }
  function drawTroops() {
    for (const q of troops) {
      if (q.state === 'fall') {
        if (q.b === 'air' && q.chute > 0) {
          const cs = q.chute; ctx.save(); ctx.translate(q.x, q.y - 12); ctx.rotate(q.rot * 0.6); ctx.scale(cs, cs);
          ctx.drawImage(CHUTE, -20, -30, 40, 30); ctx.restore();
        }
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const hg = ctx.createRadialGradient(q.x, q.y, 2, q.x, q.y, 24); hg.addColorStop(0, `rgba(${BR[q.b].glow},.35)`); hg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(q.x, q.y, 24, 0, 7); ctx.fill(); ctx.restore();
        drawSoldier(q.b, 'fall', Math.floor(q.ft * 8), q.x, q.y, 34, q.rot);
      } else if (q.state === 'ride') {
        const pop = 1 + Math.max(0, 0.3 - q.t) * 1.4;
        ctx.save(); ctx.translate(q.x, q.y - Math.sin(Math.min(1, q.t * 3) * Math.PI) * 6); ctx.scale(pop, 2 - pop);
        drawSoldier(q.b, 'salute', 0, 0, 0, 30, 0, Math.min(1, (0.85 - q.t) * 4));
        ctx.restore();
      }
    }
  }
  function drawAir() {
    for (const b of bombs) {
      ctx.fillStyle = '#39404d'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 2.4, 4.4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffcf5a'; ctx.fillRect(b.x - 2.4, b.y - 5.6, 4.8, 1.4);
    }
    for (const j of jets) {
      ctx.save(); ctx.translate(j.x, j.y); if (j.dir < 0) ctx.scale(-1, 1);
      ctx.globalCompositeOperation = 'lighter'; const fl = ctx.createRadialGradient(-30, 0, 1, -30, 0, 14); fl.addColorStop(0, 'rgba(255,190,90,.9)'); fl.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(-30, 0, 14, 0, 7); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(JET, -30, -13, 60, 26); ctx.restore();
    }
    for (const d of drones) {
      if (d.zap > 0 && d.beam) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(160,255,200,.9)'; ctx.lineWidth = 2.4; ctx.shadowColor = '#9fffc8'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(d.x, d.y - 4); ctx.lineTo(d.beam.x, d.beam.y); ctx.stroke(); ctx.restore();
      }
      ctx.save(); ctx.translate(d.x, d.y);
      ctx.fillStyle = '#2b3240'; rr(ctx, -9, -3, 18, 6, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(200,220,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-14, -5); ctx.lineTo(14, -5); ctx.stroke();
      const sp = Math.sin(T * 60) * 5; ctx.fillStyle = 'rgba(220,235,255,.6)'; ctx.fillRect(-14 - sp / 2, -6.2, sp, 1.4); ctx.fillRect(14 - sp / 2, -6.2, sp, 1.4);
      ctx.fillStyle = Math.sin(T * 12) > 0 ? '#9fffc8' : '#2e6b4c'; ctx.beginPath(); ctx.arc(0, 1, 1.6, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
  function drawFx() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of PARTS) if (p.on) {
      const a = p.life / p.max;
      ctx.globalAlpha = Math.min(1, a * 1.4);
      ctx.fillStyle = p.color;
      if (p.kind === 3) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); ctx.restore(); }
      else if (p.kind === 2) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.7, p.size); ctx.lineTo(-p.size * 0.7, p.size * 0.4); ctx.closePath(); ctx.fill(); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.kind === 4 ? 1 + (1 - a) : a * 0.6 + 0.4), 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const r of RINGS) if (r.on) {
      const a = r.life / r.max, rad = r.r * (1.25 - a * 0.9 + 0.2);
      ctx.strokeStyle = `rgba(${r.color},${(a * 0.9).toFixed(3)})`; ctx.lineWidth = r.width * a + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 7); ctx.stroke();
    }
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of TEXTS) if (t.on) {
      const a = t.life / t.max, pop = 1 + Math.max(0, a - 0.8) * 2.5;
      ctx.font = `900 ${Math.round(t.size * pop)}px ui-sans-serif,system-ui,"Segoe UI",Arial`;
      ctx.lineWidth = 3; ctx.strokeStyle = `rgba(4,8,18,${(a * 0.8).toFixed(3)})`; ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = `rgba(${t.color},${Math.min(1, a * 1.6).toFixed(3)})`; ctx.fillText(t.str, t.x, t.y);
    }
  }
  function drawBanners() {
    let y = H * 0.42;
    for (const b of G.banners) {
      const t = b.t, a = Math.min(1, t * 5, (b.life - t) * 3), sc = 0.7 + 0.3 * elastic(Math.min(1, t * 2.2));
      ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = 'rgba(4,8,18,.62)'; rr(ctx, -150, -24, 300, 50, 12); ctx.fill();
      ctx.strokeStyle = `rgba(${b.color},.6)`; ctx.lineWidth = 1.2; ctx.stroke();
      const g = ctx.createLinearGradient(-120, 0, 120, 0); g.addColorStop(0, '#b5c46a'); g.addColorStop(0.5, '#ffcf5a'); g.addColorStop(1, '#ff9a5a');
      ctx.fillStyle = g; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 20px ui-sans-serif,system-ui,"Segoe UI",Arial'; ctx.fillText(b.text, 0, -6, 280);
      ctx.fillStyle = `rgba(${b.color},1)`; ctx.font = '800 11px ui-sans-serif,system-ui,"Segoe UI",Arial'; ctx.fillText(b.sub, 0, 14, 280);
      ctx.restore(); y += 58;
    }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    if (S) {
      const sh = G.shake, sx = sh > 0.2 ? rand(-sh, sh) : 0, sy = sh > 0.2 ? rand(-sh, sh) : 0;
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (offX + sx) * dpr, (offY + sy) * dpr);
      drawField(); drawBricks(); drawBarrier(); drawAir(); drawTroops(); drawPaddle(); drawBalls(); drawFx(); drawBanners();
      if (balls.some((b) => b.stuck) && G.mode === 'play' && G.waveT <= 0) {
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 5); ctx.fillStyle = '#ffcf5a'; ctx.textAlign = 'center';
        ctx.font = '900 12px ui-sans-serif,system-ui,"Segoe UI",Arial'; ctx.fillText('TAP OR SPACE TO LAUNCH', W / 2, PADDLE_Y - 40); ctx.globalAlpha = 1;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    if (VIG) ctx.drawImage(VIG, 0, 0, vw, vh);
    if (G.flash > 0.01) { ctx.fillStyle = `rgba(${G.flashC},${(G.flash * 0.5).toFixed(3)})`; ctx.fillRect(0, 0, vw, vh); }
  }

  // ─────────────────────────────── HUD + overlays ───────────────────────────
  const hudCache = {};
  function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
  function updateHud(force) {
    if (!S) return;
    if (force) for (const k in hudCache) delete hudCache[k];
    setText('livesV', String(S.lives)); setText('waveV', String(G.wave)); setText('scoreV', fmt(G.shownScore));
    const m = MISSIONS[S.mi];
    if (m) {
      const v = Math.min(m.n, Math.max(0, missionValue(m)));
      setText('goalN', `GOAL ${S.mi + 1}/${MISSIONS.length}`); setText('goalT', m.t);
      setText('goalP', m.n >= 1000 ? `${fmt(v)}/${fmt(m.n)}` : `${v}/${m.n}`);
      const w = `${Math.round(v / m.n * 100)}%`; if (hudCache.fill !== w) { hudCache.fill = w; $('goalFill').style.width = w; }
    } else {
      setText('goalN', 'ENDLESS'); setText('goalT', `Hold the line · best chain ${S.bestChain}`); setText('goalP', `${S.rescued} saved`);
      if (hudCache.fill !== '100%') { hudCache.fill = '100%'; $('goalFill').style.width = '100%'; }
    }
  }
  function troopArt() {
    return BRANCHES.map((b) => {
      const f = POSES[b].idle, dur = b === 'army' ? 0.7 : b === 'marine' ? 0.8 : 1.3;
      return `<div class="trooper">${soldierSVG(b, f, dur, 0).replace('<svg ', '<svg role="img" aria-label="' + BR[b].name + ' trooper" ')}<span class="tag" style="color:${BR[b].css}">${BR[b].name}</span></div>`;
    }).join('');
  }
  function powersHtml() {
    return `<div class="powers">${BRANCHES.map((b) => `<div class="pw" style="--c:${BR[b].css}"><b>${BR[b].name} &middot; ${BR[b].power}</b>${BR[b].blurb}</div>`).join('')}</div>`;
  }
  function ladderHtml() {
    return `<ul class="ladder">${MISSIONS.map((m, i) => `<li class="${i < S.done ? 'ok' : ''}"><span>${i < S.done ? '&#10003;' : '&middot;'}</span>${i + 1}. ${m.t}</li>`).join('')}</ul>`;
  }
  function statsHtml() {
    const st = [['SCORE', fmt(S.score)], ['RESCUED', String(S.rescued)], ['MISSIONS', `${S.done}/${MISSIONS.length}`], ['BEST CHAIN', String(S.bestChain)]];
    return st.map(([l, v]) => `<div><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
  }
  let primaryAct = null, secondaryAct = null;
  function showOverlay(o) {
    $('ovTitle').textContent = o.title; $('ovTitle').className = o.bad ? 'bad' : '';
    $('ovSub').textContent = o.sub || '';
    $('ovBody').innerHTML = o.body || '';
    $('ovArt').innerHTML = o.art ? troopArt() : '';
    $('ovStats').innerHTML = o.stats ? statsHtml() : '';
    $('ovExtra').innerHTML = o.extra || '';
    $('btnPrimary').textContent = o.primary; primaryAct = o.onPrimary;
    const sec = $('btnSecondary');
    sec.hidden = !o.secondary; sec.textContent = o.secondary || ''; secondaryAct = o.onSecondary || null;
    $('overlay').hidden = false;
    try { $('btnPrimary').focus(); } catch (e) { /* not focusable in this host */ }
  }
  function hideOverlay() { $('overlay').hidden = true; }
  function titleScreen() {
    G.mode = 'title'; G.auto = true; newRun();
    showOverlay({
      title: 'BRICK BRIGADE', sub: 'Rescue Run', art: true,
      body: 'Troops from every branch are <b>sealed inside the wall</b>. Crack their cells, <b>catch them</b> on your rescue carrier, and each branch lends you its power.',
      extra: powersHtml(), primary: 'Deploy', onPrimary: startRun,
    });
  }
  function startRun() { audioStart(); G.auto = false; G.mode = 'play'; newRun(); hideOverlay(); }
  function pause() {
    if (G.mode !== 'play') return;
    G.mode = 'paused';
    showOverlay({ title: 'PAUSED', sub: `Wave ${G.wave} · ${G.waveName}`, stats: true, extra: ladderHtml(), primary: 'Resume', onPrimary: resume, secondary: 'New run', onSecondary: startRun });
  }
  function resume() { audioStart(); G.mode = 'play'; hideOverlay(); }
  function gameOver() {
    G.mode = 'over'; SFX.over();
    showOverlay({ title: 'OUT OF LIVES', bad: true, sub: `Fell at wave ${G.wave} · ${G.waveName}`, stats: true,
      body: S.done ? `You finished <b>${S.done} of ${MISSIONS.length}</b> missions and brought <b>${S.rescued}</b> troops home.` : 'Every run teaches the wall. Catch a troop early: their powers carry the fight.',
      extra: ladderHtml(), primary: 'Redeploy', onPrimary: startRun });
  }
  function victory() {
    G.mode = 'won'; SFX.win(); flash(0.5, '255,240,190'); shake(6);
    for (let i = 0; i < 90; i++) part(rand(0, W), rand(-20, 60), rand(-60, 60), rand(40, 180), rand(1.6, 3), rand(2.5, 5), pick(['#ffcf5a', '#b5c46a', '#7fa6ff', '#ff5a6a', '#ffffff']), 3);
    showOverlay({ title: 'MISSION ACCOMPLISHED', sub: 'Every branch came home', art: true, stats: true,
      body: `All <b>${MISSIONS.length}</b> missions done. The Fortress fell and <b>${S.rescued}</b> troops were rescued. Keep fighting in endless waves, or start a fresh run.`,
      primary: 'Keep fighting', onPrimary: () => { audioStart(); G.endless = true; G.mode = 'play'; hideOverlay(); }, secondary: 'New run', onSecondary: startRun });
  }

  // ─────────────────────────────── input ───────────────────────────────
  function toField(clientX) { return (clientX - offX) / scale; }
  cv.addEventListener('pointermove', (e) => { if (G.mode === 'play' && P) P.tx = toField(e.clientX); });
  cv.addEventListener('pointerdown', (e) => {
    audioStart();
    if (G.mode !== 'play' || !P) return;
    P.tx = toField(e.clientX);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    launch();
  });
  $('btnPrimary').addEventListener('click', () => { if (primaryAct) primaryAct(); });
  $('btnSecondary').addEventListener('click', () => { if (secondaryAct) secondaryAct(); });
  $('pauseBtn').addEventListener('click', () => { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); });
  $('muteBtn').addEventListener('click', () => { audioStart(); setMuted(!A.muted); });
  window.addEventListener('keydown', (e) => {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA') { keys.left = true; e.preventDefault(); }
    else if (c === 'ArrowRight' || c === 'KeyD') { keys.right = true; e.preventDefault(); }
    else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
      e.preventDefault(); audioStart();
      if (G.mode === 'play') launch();
      else if (G.mode === 'title') startRun();
    } else if (c === 'Enter') { if (G.mode !== 'play' && primaryAct) { e.preventDefault(); primaryAct(); } }
    else if (c === 'KeyP' || c === 'Escape') { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyM') { audioStart(); setMuted(!A.muted); }
    else if (c === 'KeyR') { if (G.mode === 'paused' || G.mode === 'over' || G.mode === 'won') startRun(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });
  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { keys.left = keys.right = false; if (G.mode === 'play') pause(); });

  // ─────────────────────────────── loop ───────────────────────────────
  let last = 0;
  function frame(ts) {
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
    last = ts;
    update(dt);
    updateHud(false);
    render();
    audioTick();
    requestAnimationFrame(frame);
  }
  // A small handle for automated playtests. Nothing in the game reads it.
  window.__brickBrigade = {
    state: () => ({ mode: G.mode, wave: G.wave, score: S && S.score, lives: S && S.lives, mission: S && S.mi + 1, done: S && S.done, rescued: S && S.rescued, bricks: bricks.filter((k) => k.alive).length, balls: balls.length, troops: troops.length }),
    autopilot: (on) => { G.auto = !!on; },
    clearWave: () => { for (const k of bricks) if (k.alive) hitBrick(k, k.hp); },
  };
  bakeSoldiers();
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
