<!-- Signal Garden: Heartbloom. An original tower defense: blight pests crawl, skitter and flutter along a glowing trail toward the Heartbloom, and you grow a garden of living defenders (Thornlings, Dewcaps, Bloomcannons and Lumen Vines) that each have a face, a temper and three stages of growth. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SIGNAL GARDEN</title>
<style>
:root{--bg:#030a0b;--ink:#e8f7ee;--dim:#86a39a;--gold:#ffd66b;--leaf:#9be87a;--cyan:#7ff0e0;--rose:#ff8fb0;--red:#ff6a6a;--violet:#b99bff;--panel:rgba(5,15,16,.93)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:pointer;outline:none}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(6,18,18,.66);border:1px solid rgba(155,232,122,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#petalV{color:var(--rose)}
#sapV{color:var(--leaf)}
#petalChip.low #petalV{color:var(--red)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,214,107,.42)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--cyan);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold));box-shadow:0 0 8px rgba(255,214,107,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,214,107,.95);border-color:var(--gold)}100%{box-shadow:none}}
.chip.bump{animation:bump .38s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(6,18,18,.72);border:1px solid rgba(155,232,122,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--leaf);box-shadow:0 0 12px rgba(155,232,122,.45);outline:none}
.hbtn svg{display:block;margin:auto}
.hbtn.tog[aria-pressed="false"]{color:var(--dim);background:linear-gradient(135deg,transparent 46%,rgba(255,106,106,.75) 47%,rgba(255,106,106,.75) 53%,transparent 54%),rgba(6,18,18,.72)}
#sunBtn{flex:none;position:relative;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;height:31px;padding:0 8px;border-radius:10px;color:var(--gold);font:900 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:rgba(6,18,18,.72);border:1px solid rgba(255,214,107,.4);overflow:hidden}
#sunBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#sunBtn.ready{border-color:var(--gold);animation:ready 1s ease-in-out infinite alternate}
#sunBtn:disabled{cursor:default;color:var(--dim)}
#sunBtn b{min-width:30px;text-align:right}
@keyframes ready{from{box-shadow:0 0 8px rgba(255,214,107,.35)}to{box-shadow:0 0 22px rgba(255,214,107,.85)}}
#tray{position:fixed;left:0;right:0;bottom:0;height:58px;z-index:5;display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(0deg,rgba(3,10,11,.94),rgba(3,10,11,.6));border-top:1px solid rgba(155,232,122,.18)}
#seeds,#inspect{flex:1 1 auto;min-width:0;display:flex;gap:5px;align-items:center;height:100%}
.seed{flex:1 1 0;min-width:0;position:relative;height:46px;border-radius:11px;cursor:pointer;color:var(--ink);background:rgba(10,28,26,.85);border:1px solid rgba(155,232,122,.3);font:800 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;padding:0 6px 0 44px;text-align:left;overflow:hidden}
.seed svg{position:absolute;left:3px;top:3px;width:38px;height:38px}
.seed .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.seed .cost{display:block;margin-top:5px;color:var(--gold);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seed:hover,.seed:focus-visible{outline:none;border-color:var(--leaf);box-shadow:0 0 12px rgba(155,232,122,.35)}
.seed[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 14px rgba(255,214,107,.45),inset 0 -3px 0 var(--gold)}
.seed.poor{opacity:.66}
.seed.poor .cost{color:var(--red)}
.seed.locked{opacity:.42;cursor:default}
.seed.locked svg{filter:grayscale(1)}
.seed.unlock{animation:unlock 1.4s ease}
@keyframes unlock{0%{box-shadow:0 0 34px rgba(127,240,224,1);border-color:var(--cyan)}100%{box-shadow:none}}
.tbtn{flex:none;height:46px;min-width:40px;padding:0 10px;border-radius:11px;cursor:pointer;color:var(--ink);background:rgba(10,28,26,.85);border:1px solid rgba(155,232,122,.3);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbtn:hover:not(:disabled),.tbtn:focus-visible{outline:none;border-color:var(--leaf);box-shadow:0 0 12px rgba(155,232,122,.35)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#sendBtn{position:relative;overflow:hidden;min-width:118px;max-width:200px;text-align:center;border-color:rgba(255,214,107,.55);background:linear-gradient(180deg,rgba(255,214,107,.2),rgba(155,232,122,.06))}
#sendBtn .st{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
#sendBtn .sb{display:block;margin-top:4px;color:var(--gold);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sendBtn .sb:empty{display:none}
#sendBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold))}
#insName{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:12px;padding-left:4px;color:var(--leaf)}
#growBtn{border-color:rgba(255,214,107,.55)}
@media (max-width:700px){#hud{gap:4px;padding:7px 5px}.chip .lbl{display:none}.chip{padding:0 7px}.chip.goal .gn{display:none}.seed{padding:0 4px 0 38px}.seed svg{top:7px;width:31px;height:31px}.seed .nm{display:none}.seed .cost{margin-top:0}}
@media (max-width:520px){.hbtn{width:27px}#sunBtn{padding:0 6px}#sunBtn b{display:none}
  #tray{gap:4px;padding:6px 5px}.seed{padding:0 2px;text-align:center}.seed svg{position:static;display:block;margin:2px auto 0;width:26px;height:26px}.seed .nm{display:none}.seed .cost{margin-top:1px;font-size:11px}
  #sendBtn{min-width:78px}#sendBtn .sb{display:none}.tbtn{padding:0 7px}#insName{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,8,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:var(--panel);border:1px solid rgba(155,232,122,.32);border-radius:18px;padding:14px 18px 12px;width:min(560px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(155,232,122,.14),inset 0 0 60px rgba(14,40,34,.6)}
h1{font-size:clamp(28px,8vw,44px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:2px 0;background:linear-gradient(90deg,#9be87a 0%,#7ff0e0 35%,#ffd66b 68%,#ff8fb0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(155,232,122,.4))}
h1.bad{background:linear-gradient(90deg,#ff6a6a,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--gold);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#c9e6d8;max-width:56ch;margin:0 auto 6px}
.pitch b{color:var(--gold)}
.castlbl{font-size:9px;letter-spacing:.34em;color:var(--dim);font-weight:800;margin-top:2px}
.cast{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;margin:2px 0 4px}
.who{width:90px;text-align:center}
.who svg{display:block;margin:0 auto;width:46px;height:46px}
.who span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.legend{font-size:11px;color:var(--dim);margin-top:6px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--leaf);background:rgba(155,232,122,.08);border:1px solid rgba(155,232,122,.45)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(155,232,122,.16),rgba(155,232,122,.04));border:1px solid rgba(155,232,122,.5)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(155,232,122,.5);outline:none}
.btn.primary{font-size:16px;padding:12px 32px;background:linear-gradient(180deg,rgba(255,214,107,.26),rgba(155,232,122,.06));border-color:rgba(255,214,107,.7);box-shadow:0 0 18px rgba(255,214,107,.28)}
#ovStats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:62px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#c8f5a8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
@media (max-height:820px){.panel{padding:10px 16px}h1{font-size:clamp(24px,5.6vh,40px)}.pitch{font-size:12px;line-height:1.4}.ladder li{font-size:10.5px}#ovStats .val{font-size:18px}.btn.primary{padding:10px 28px;font-size:15px}.legend{margin-top:4px;line-height:1.8;font-size:10.5px}}
@media (max-height:600px){.pitch,.ladder{display:none}h1{font-size:30px}.who svg{width:38px;height:38px}.who{width:86px}.legend{line-height:1.6}}
</style>
</head>
<body>
<canvas id="field" tabindex="0" role="img" aria-label="Signal Garden: pests walk the glowing trail toward the Heartbloom. Choose a seed, then tap an open plot or move with the arrow keys and press Enter."></canvas>
<div id="hud">
  <div class="chip" id="petalChip" title="Heartbloom petals: lose them all and the garden wilts"><span class="lbl">PETALS</span><b id="petalV">20</b></div>
  <div class="chip" title="Sap: spend it on seeds and growth"><span class="lbl">SAP</span><b id="sapV">150</b></div>
  <div class="chip" title="Score"><span class="lbl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Plant 3 seedlings</span><span class="gp" id="goalP">0/3</span><i id="goalFill"></i></div>
  <button id="sunBtn" type="button" aria-label="Call a Sunburst on every pest (E)" title="Sunburst (E)" disabled><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></g></svg><b id="sunV">0%</b><i id="sunFill"></i></button>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P)">II</button>
  <button id="musicBtn" class="hbtn tog" type="button" aria-label="Turn music on (M)" aria-pressed="false" title="Music (M)">&#9835;</button>
  <button id="muteBtn" class="hbtn tog" type="button" aria-label="Turn sound effects on (N)" aria-pressed="false" title="Sound effects (N)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q1.6 2.5 0 5M12.8 4q2.8 4 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
</div>
<div id="tray" aria-label="Garden controls">
  <div id="seeds" role="group" aria-label="Seeds">
    <button class="seed" id="seedThorn" type="button" aria-pressed="false" title="Thornling (1): rapid thorn darts at one pest"></button>
    <button class="seed" id="seedDew" type="button" aria-pressed="false" title="Dewcap (2): a chilling puff that slows everything nearby"></button>
    <button class="seed" id="seedBloom" type="button" aria-pressed="false" title="Bloomcannon (3): lobs seed pods that burst on the ground and crack armor"></button>
    <button class="seed" id="seedVine" type="button" aria-pressed="false" title="Lumen Vine (4): signal arcs leap between pests and ignore armor"></button>
  </div>
  <div id="inspect" role="group" aria-label="Selected plant" hidden>
    <span id="insName">Thornling</span>
    <button class="tbtn" id="growBtn" type="button" title="Grow this plant a stage (G)">Grow</button>
    <button class="tbtn" id="sellBtn" type="button" title="Compost this plant for sap (X)">Compost</button>
    <button class="tbtn" id="aimBtn" type="button" title="Switch the target: first in line or strongest (T)">First</button>
    <button class="tbtn" id="closeBtn" type="button" aria-label="Deselect (Esc)" title="Deselect (Esc)">&#10005;</button>
  </div>
  <button class="tbtn" id="speedBtn" type="button" aria-pressed="false" title="Game speed (F)">1x</button>
  <button class="tbtn" id="sendBtn" type="button" title="Send the next migration (Space). Sending early pays bonus sap."><span class="st" id="sendT">Send migration 1</span><span class="sb" id="sendB"></span><i id="sendFill"></i></button>
</div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel">
    <h1 id="ovTitle">SIGNAL GARDEN</h1>
    <div id="ovSub" class="sub">Heartbloom</div>
    <p id="ovBody" class="pitch"></p>
    <div id="ovStats"></div>
    <div id="ovExtra"></div>
    <div class="row2"><button id="btnPrimary" class="btn primary" type="button">Plant the garden</button><button id="btnSecondary" class="btn" type="button" hidden>New garden</button></div>
    <div class="legend"><kbd>1</kbd>-<kbd>4</kbd> seeds &middot; tap a plot &middot; <kbd>Space</kbd> send &middot; <kbd>G</kbd> grow &middot; <kbd>X</kbd> compost &middot; <kbd>E</kbd> sunburst &middot; <kbd>F</kbd> speed &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> music &middot; <kbd>N</kbd> sound</div>
  </div>
</div>
<script>
'use strict';
(function () {
  // ─────────────────────────────── basics ───────────────────────────────
  const $ = (id) => document.getElementById(id);
  const HUD_H = 46, TRAY_H = 58, C = 40, RS = 3, TAU = Math.PI * 2;
  const cv = $('field'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function sprite(w, h, draw) { const c = mk(w * RS, h * RS), g = c.getContext('2d'); g.scale(RS, RS); draw(g); return c; }
  let vw = 400, vh = 720, dpr = 1, scale = 1, offX = 0, offY = HUD_H, T = 0;

  // ─────────────────────────────── maps ───────────────────────────────
  // Two gardens: a wide one for the short, wide Preview panel and a tall one for phones and narrow panels.
  // The trail is a list of cell waypoints; pests walk it by distance, moths fly straight at the heart.
  const MAPS = {
    wide: { cols: 14, rows: 8, path: [[-1, 1], [3, 1], [3, 5], [7, 5], [7, 2], [10, 2], [10, 6], [12, 6]] },
    tall: { cols: 9, rows: 13, path: [[1, -1], [1, 2], [7, 2], [7, 5], [1, 5], [1, 8], [6, 8], [6, 11]] },
  };
  let MAP = null, W = 360, H = 520, ROUTE = [], SEGL = [], PATH_LEN = 1, LINE_LEN = 1, HEART = { x: 0, y: 0 }, ENTRY = { x: 0, y: 0 }, GROUND = null, BRAMBLE_AT = [];
  const PATHSET = new Set(), NOPLANT = new Set(), COVER = new Map();
  const ck = (c, r) => (r + 2) * 64 + c + 2;
  const cx = (c) => c * C + C / 2, cy = (r) => r * C + C / 2;
  function pointAt(d) {
    d = clamp(d, 0, PATH_LEN);
    for (let i = 0; i < SEGL.length; i++) {
      if (d <= SEGL[i] || i === SEGL.length - 1) { const u = SEGL[i] ? Math.min(1, d / SEGL[i]) : 0, a = ROUTE[i], b = ROUTE[i + 1]; return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u }; }
      d -= SEGL[i];
    }
    return { x: HEART.x, y: HEART.y };
  }
  function buildMap(kind) {
    MAP = MAPS[kind]; MAP.kind = kind; W = MAP.cols * C; H = MAP.rows * C;
    ROUTE = MAP.path.map(([c, r]) => ({ x: cx(c), y: cy(r) }));
    SEGL = []; PATH_LEN = 0;
    for (let i = 0; i < ROUTE.length - 1; i++) { const l = Math.hypot(ROUTE[i + 1].x - ROUTE[i].x, ROUTE[i + 1].y - ROUTE[i].y); SEGL.push(l); PATH_LEN += l; }
    PATHSET.clear(); NOPLANT.clear(); COVER.clear();
    for (let i = 0; i < MAP.path.length - 1; i++) {
      const [c1, r1] = MAP.path[i], [c2, r2] = MAP.path[i + 1], dc = Math.sign(c2 - c1), dr = Math.sign(r2 - r1);
      for (let c = c1, r = r1; ; c += dc, r += dr) { PATHSET.add(ck(c, r)); NOPLANT.add(ck(c, r)); if (c === c2 && r === r2) break; }
    }
    const [hc, hr] = MAP.path[MAP.path.length - 1];
    HEART = { x: cx(hc), y: cy(hr) }; ENTRY = pointAt(C * 0.55);
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) NOPLANT.add(ck(hc + dc, hr + dr));
    LINE_LEN = Math.hypot(HEART.x - ROUTE[0].x, HEART.y - ROUTE[0].y);
    // how much trail (and moth line) each plot can reach: the autopilot plants on the richest plots
    const samples = [];
    for (let d = 0; d < PATH_LEN; d += 10) samples.push({ p: pointAt(d), w: 1 });
    for (let u = 0; u < 1; u += 0.04) samples.push({ p: { x: lerp(ROUTE[0].x, HEART.x, u), y: lerp(ROUTE[0].y, HEART.y, u) }, w: 0.5 });
    for (let r = 0; r < MAP.rows; r++) for (let c = 0; c < MAP.cols; c++) {
      if (NOPLANT.has(ck(c, r))) continue;
      let s = 0; for (const q of samples) if ((q.p.x - cx(c)) ** 2 + (q.p.y - cy(r)) ** 2 < 105 * 105) s += q.w;
      COVER.set(ck(c, r), s);
    }
    BRAMBLE_AT = [0.3, 0.5, 0.7].map((f) => ({ d: PATH_LEN * f, ...pointAt(PATH_LEN * f) }));
    bakeGround();
  }
  const plantable = (c, r) => c >= 0 && r >= 0 && c < MAP.cols && r < MAP.rows && !NOPLANT.has(ck(c, r));

  // ─────────────────────────────── the garden floor (baked once per map) ───────────────────────────────

    if (!S) return;
    const t = G.selT && towers.includes(G.selT) ? G.selT : null; if (!t) G.selT = null;
    const cd = Math.ceil(G.nextT), key = [S.sap, G.sel, t && t.id, t && t.lv, t && t.aim, G.speed, G.phase, G.wave, isFinite(G.nextT) ? cd : -1, G.queue.length + pests.length, S.vine, G.mode].join('|');
    if (!force && key === trayKey) return;
    if (force || trayKey.split('|')[10] !== String(S.vine)) fillSeedCards();
    trayKey = key;
    for (const k of KINDS) {
      const b = $(SEEDS[k].btn), lock = seedLocked(k);
      b.setAttribute('aria-pressed', G.sel === k ? 'true' : 'false');
      b.classList.toggle('poor', !lock && S.sap < SEEDS[k].cost); b.classList.toggle('locked', lock);
    }
    $('seeds').hidden = !!t; $('inspect').hidden = !t;
    if (t) {
      const d = SEEDS[t.kind], gc = growCost(t);
      $('insName').textContent = `${d.name} · Lv ${t.lv}${t.kills ? ' · ' + t.kills + ' down' : ''}`;
      $('growBtn').textContent = t.lv >= 3 ? 'Full bloom' : `Grow ${gc}`; $('growBtn').disabled = t.lv >= 3 || S.sap < gc;
      $('sellBtn').textContent = `Compost +${refund(t)}`;
      $('aimBtn').textContent = t.aim === 'first' ? 'First' : 'Strong';
    }
    $('speedBtn').textContent = `${G.speed}x`; $('speedBtn').setAttribute('aria-pressed', G.speed === 2 ? 'true' : 'false');
    const send = $('sendBtn');
    if (G.phase === 'wave') { $('sendT').textContent = `Migration ${G.wave}`; $('sendB').textContent = `${G.queue.filter((q) => q.kind).length + pests.length} left`; send.disabled = true; $('sendFill').style.width = '0%'; }
    else if (!isFinite(G.nextT)) { $('sendT').textContent = `Send migration ${G.wave + 1}`; $('sendB').textContent = 'when you are ready'; send.disabled = G.mode !== 'play'; $('sendFill').style.width = '0%'; }
    else { $('sendT').textContent = `Send ${G.wave + 1} now`; $('sendB').textContent = `in ${cd}s · early +${cd * 2} sap`; send.disabled = G.mode !== 'play'; $('sendFill').style.width = `${Math.round(G.nextT / BUILD_T * 100)}%`; }
  }
  function ladderHtml() { return `<ul class="ladder">${MISSIONS.map((m, i) => `<li class="${i < S.done ? 'ok' : ''}"><span>${i < S.done ? '&#10003;' : '&middot;'}</span>${i + 1}. ${m.t}</li>`).join('')}</ul>`; }
  function statsHtml() {
    return [['SCORE', fmt(S.score)], ['COMPOSTED', String(S.kills)], ['MIGRATIONS', String(S.waves)], ['MISSIONS', `${S.done}/${MISSIONS.length}`]]
      .map(([l, v]) => `<div><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
  }
  let primaryAct = null, secondaryAct = null;
  function showOverlay(o) {
    $('ovTitle').textContent = o.title; $('ovTitle').className = o.bad ? 'bad' : '';
    $('ovSub').textContent = o.sub || ''; $('ovBody').innerHTML = o.body || '';
    $('ovStats').innerHTML = o.stats ? statsHtml() : ''; $('ovExtra').innerHTML = o.extra || '';
    $('btnPrimary').textContent = o.primary; primaryAct = o.onPrimary;
    const sec = $('btnSecondary'); sec.hidden = !o.secondary; sec.textContent = o.secondary || ''; secondaryAct = o.onSecondary || null;
    $('overlay').hidden = false;
    try { $('btnPrimary').focus(); } catch (e) { /* not focusable here */ }
  }
  function hideOverlay() { $('overlay').hidden = true; try { cv.focus({ preventScroll: true }); } catch (e) { /* optional */ } }
  function titleScreen() {
    G.mode = 'title'; G.auto = true; newRun();
    showOverlay({ title: 'SIGNAL GARDEN', sub: 'Heartbloom',
      body: 'The blight is migrating down the glowing trail toward the <b>Heartbloom</b>. Plant living defenders beside the trail, grow them into full bloom, and hold ten migrations and the <b>Rot Titan</b>.',
      extra: castHtml(), primary: 'Plant the garden', onPrimary: startRun });
  }
  function startRun() { audioStart(); G.auto = false; G.mode = 'play'; newRun(); hideOverlay(); }
  function pause() { if (G.mode !== 'play') return; G.mode = 'paused'; updateTray(true); showOverlay({ title: 'PAUSED', sub: G.wave ? `Migration ${G.wave} · ${G.waveName}` : 'Before the first migration', stats: true, extra: ladderHtml(), primary: 'Resume', onPrimary: resume, secondary: 'New garden', onSecondary: startRun }); }
  function resume() { audioStart(); G.mode = 'play'; hideOverlay(); updateTray(true); }
  function gameOver() {
    G.mode = 'over'; SFX.over(); updateTray(true);
    showOverlay({ title: 'GARDEN WILTED', bad: true, sub: `Fell at migration ${G.wave} · ${G.waveName}`, stats: true,
      body: S.done ? `You finished <b>${S.done} of ${MISSIONS.length}</b> missions and composted <b>${S.kills}</b> pests.` : 'Plant beside the bends where the trail doubles back: one plant covers two stretches of it.',
      extra: ladderHtml(), primary: 'Replant', onPrimary: startRun });
  }
  function victory() {
    G.mode = 'won'; SFX.win(); flash(0.5, '220,255,220'); shake(6); updateTray(true);
    for (let i = 0; i < 80; i++) part(rand(0, W), rand(-20, 40), rand(-60, 60), rand(40, 160), rand(1.6, 3), rand(3, 5), pick(['#ff8fb0', '#ffd66b', '#9be87a', '#ffc0d4']), 3);
    showOverlay({ title: 'GARDEN HELD', sub: 'The Rot Titan is felled', stats: true,
      body: `All <b>${MISSIONS.length}</b> missions done with <b>${S.heart}</b> petals left on the Heartbloom. Keep growing through endless migrations, or plant a new garden.`,
      primary: 'Keep growing', onPrimary: () => { audioStart(); G.endless = true; G.mode = 'play'; hideOverlay(); updateTray(true); }, secondary: 'New garden', onSecondary: startRun });
  }

  // ─────────────────────────────── input ───────────────────────────────
  function toCell(e) { const x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale; return { c: Math.floor(x / C), r: Math.floor(y / C) }; }
  cv.addEventListener('pointerdown', (e) => { audioStart(); if (G.mode !== 'play' || !MAP) return; const p = toCell(e); G.cur.vis = false; onTile(p.c, p.r); });
  cv.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse' || !MAP) return; const p = toCell(e); G.hover = p.c >= 0 && p.r >= 0 && p.c < MAP.cols && p.r < MAP.rows ? p : null; });
  cv.addEventListener('pointerleave', () => { G.hover = null; });
  for (const k of KINDS) $(SEEDS[k].btn).addEventListener('click', () => { audioStart(); chooseSeed(k); });
  const withSel = (fn) => () => { audioStart(); if (G.selT && G.mode === 'play') fn(G.selT); };
  $('growBtn').addEventListener('click', withSel(grow));
  $('sellBtn').addEventListener('click', withSel(compost));
  $('aimBtn').addEventListener('click', withSel((t) => { t.aim = t.aim === 'first' ? 'strong' : 'first'; updateTray(true); }));
  $('closeBtn').addEventListener('click', () => { G.selT = null; updateTray(true); });
  $('speedBtn').addEventListener('click', () => { G.speed = G.speed === 1 ? 2 : 1; updateTray(true); });
  $('sendBtn').addEventListener('click', () => { audioStart(); if (G.mode === 'play') startWave(); });
  $('sunBtn').addEventListener('click', () => { if (G.mode === 'play') sunburst(); });
  $('btnPrimary').addEventListener('click', () => { if (primaryAct) primaryAct(); });
  $('btnSecondary').addEventListener('click', () => { if (secondaryAct) secondaryAct(); });
  $('pauseBtn').addEventListener('click', () => { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); });
  $('musicBtn').addEventListener('click', () => { audioStart(); setMusic(!A.musicOn); });
  $('muteBtn').addEventListener('click', () => { audioStart(); setSound(!A.sfxOn); });
  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  window.addEventListener('keydown', (e) => {
    const c = e.code, playing = G.mode === 'play';
    if (ARROWS[c]) { e.preventDefault(); if (!playing) return; G.cur.vis = true; G.cur.c = clamp(G.cur.c + ARROWS[c][0], 0, MAP.cols - 1); G.cur.r = clamp(G.cur.r + ARROWS[c][1], 0, MAP.rows - 1); return; }
    if (c === 'Space' || c === 'Enter' || c === 'NumpadEnter') {
      e.preventDefault();
      if (!playing) { if (primaryAct && G.mode !== 'play') primaryAct(); return; }
      if (c === 'Space') startWave(); else { G.cur.vis = true; onTile(G.cur.c, G.cur.r); }
      return;
    }
    const digit = { Digit1: 'thorn', Digit2: 'dew', Digit3: 'bloom', Digit4: 'vine', Numpad1: 'thorn', Numpad2: 'dew', Numpad3: 'bloom', Numpad4: 'vine' }[c];
    if (digit) { audioStart(); chooseSeed(digit); }
    else if (c === 'KeyW') { if (playing) startWave(); }
    else if (c === 'KeyG') { if (playing && G.selT) grow(G.selT); }
    else if (c === 'KeyX' || c === 'Delete') { if (playing && G.selT) compost(G.selT); }
    else if (c === 'KeyT') { if (playing && G.selT) { G.selT.aim = G.selT.aim === 'first' ? 'strong' : 'first'; updateTray(true); } }
    else if (c === 'KeyE') { if (playing) sunburst(); }
    else if (c === 'KeyF') { G.speed = G.speed === 1 ? 2 : 1; updateTray(true); }
    else if (c === 'Escape') { if (G.sel || G.selT) { G.sel = null; G.selT = null; G.cur.vis = false; updateTray(true); } else if (playing) pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyP') { if (playing) pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyM') { audioStart(); setMusic(!A.musicOn); }
    else if (c === 'KeyN') { audioStart(); setSound(!A.sfxOn); }
    else if (c === 'KeyR') { if (G.mode === 'paused' || G.mode === 'over' || G.mode === 'won') startRun(); }
  });
  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { if (G.mode === 'play') pause(); });

  // ─────────────────────────────── loop ───────────────────────────────
  let last = 0;
  function frame(ts) {
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
    last = ts;
    update(dt); updateHud(false); updateTray(false); render(); audioTick();
    requestAnimationFrame(frame);
  }
  // A small handle for automated playtests. Nothing in the game reads it.
  window.__signalGarden = {
    state: () => ({ mode: G.mode, map: MAP && MAP.kind, wave: G.wave, phase: G.phase, heart: S && S.heart, sap: S && S.sap, score: S && S.score, mission: S && S.mi + 1, done: S && S.done, kills: S && S.kills, towers: towers.length, pests: pests.length, queue: G.queue.length, titans: S && S.titans, sun: S && S.sun, fireflies: fireflies.length, front: pests.reduce((m, p) => Math.max(m, progress(p) / PATH_LEN), 0) }),
    autopilot: (on) => { G.auto = !!on; },
    invulnerable: (on) => { G.godTest = !!on; },
    clearWave: () => { G.queue = []; for (const p of pests.slice()) killPest(p, null); },
    spawnTitan: () => spawn('titan'),
    titan: () => { const p = pests.find((q) => q.kind === 'titan'); return p ? { hp: Math.round(p.hp), max: Math.round(p.max), cracked: p.cracked, stage: p.stage } : null; },
    giveSap: (n) => { if (S) S.sap += n; },
  };
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
