<!-- Deck Guard: Swarm Break. An original arcade shooter: drone swarms snake down toward a carrier deck, hypersonic missiles fly their full boost, glide and dive profile, and you hold the line with your interceptor, the carrier's radar-guided interceptor net and the auto-miniguns on the parked vehicles. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DECK GUARD</title>
<style>
:root{--bg:#04070e;--ink:#eaf2ff;--dim:#8a97b3;--sea:#1d5d8f;--gold:#ffcf5a;--cyan:#7fe3ff;--red:#ff5a6a;--green:#8fe07a;--panel:rgba(7,12,24,.92)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(8,14,28,.64);border:1px solid rgba(127,227,255,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#hullV{color:var(--green)}
#hullChip.low #hullV{color:var(--red)}
#livesV{color:var(--cyan)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,207,90,.42)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--cyan);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px rgba(255,207,90,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,207,90,.95);border-color:var(--gold)}100%{box-shadow:none}}
.chip.bump{animation:bump .38s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(8,14,28,.7);border:1px solid rgba(127,227,255,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 12px rgba(127,227,255,.45);outline:none}
.hbtn svg{display:block;margin:auto}
.hbtn.tog[aria-pressed="false"]{color:var(--dim);background:linear-gradient(135deg,transparent 46%,rgba(255,90,106,.75) 47%,rgba(255,90,106,.75) 53%,transparent 54%),rgba(8,14,28,.7)}
#aegisBtn{flex:none;position:relative;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;height:31px;padding:0 8px;border-radius:10px;color:var(--cyan);font:900 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:rgba(8,14,28,.72);border:1px solid rgba(127,227,255,.4);overflow:hidden}
#aegisBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#aegisBtn.ready{border-color:var(--cyan);box-shadow:0 0 18px rgba(127,227,255,.55);animation:ready 1s ease-in-out infinite alternate}
#aegisBtn:disabled{cursor:default;color:var(--dim)}
#aegisBtn b{min-width:30px;text-align:right}
@keyframes ready{from{box-shadow:0 0 8px rgba(127,227,255,.35)}to{box-shadow:0 0 22px rgba(127,227,255,.85)}}
@media (max-width:460px){#hud{gap:4px;padding:7px 5px}.chip .lbl{display:none}.chip{padding:0 7px}.chip.goal .gn{display:none}.hbtn{width:27px}#aegisBtn{padding:0 6px}#aegisBtn b{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,5,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:var(--panel);border:1px solid rgba(127,227,255,.32);border-radius:18px;padding:16px 18px 14px;width:min(540px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(127,227,255,.14),inset 0 0 60px rgba(14,30,60,.6)}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:4px 0 2px;background:linear-gradient(90deg,#7fe3ff 0%,#dfefff 40%,#ffcf5a 70%,#ff7a5a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(127,227,255,.4))}
h1.bad{background:linear-gradient(90deg,#ff5a6a,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--gold);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#c9d6ef;max-width:54ch;margin:0 auto 8px}
.pitch b{color:var(--gold)}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:5px;margin:2px 0 8px;text-align:left}
.th{position:relative;font-size:11.5px;line-height:1.35;color:#c9d6ef;padding:6px 9px 6px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.th::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.th b{display:block;font-size:10.5px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--cyan);background:rgba(127,227,255,.08);border:1px solid rgba(127,227,255,.45)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(127,227,255,.16),rgba(127,227,255,.04));border:1px solid rgba(127,227,255,.5)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(127,227,255,.5);outline:none}
.btn.primary{font-size:16px;padding:13px 34px;background:linear-gradient(180deg,rgba(255,207,90,.26),rgba(127,227,255,.06));border-color:rgba(255,207,90,.7);box-shadow:0 0 18px rgba(255,207,90,.28)}
#ovStats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:62px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#bff5a8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
@media (max-height:820px){.panel{padding:10px 16px}h1{font-size:clamp(24px,5.6vh,40px);margin:2px 0}.pitch{font-size:12px;line-height:1.4;margin-bottom:6px}.th{font-size:10.5px;padding:4px 8px 4px 11px}.ladder li{font-size:10.5px}#ovStats .val{font-size:18px}.btn.primary{padding:10px 30px;font-size:15px}.legend{margin-top:4px;line-height:1.8;font-size:10.5px}}
@media (max-height:600px){.threats,.ladder,.pitch{display:none}h1{font-size:30px}}
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="Deck Guard playfield: move your interceptor with the pointer or arrow keys; its guns fire automatically"></canvas>
<div id="hud">
  <div class="chip" id="hullChip" title="Carrier hull"><span class="lbl">HULL</span><b id="hullV">10</b></div>
  <div class="chip" title="Interceptors left"><span class="lbl">JETS</span><b id="livesV">3</b></div>
  <div class="chip" title="Score"><span class="lbl sl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Down 15 drones</span><span class="gp" id="goalP">0/15</span><i id="goalFill"></i></div>
  <button id="aegisBtn" type="button" aria-label="Fire the Aegis interceptor net (E)" title="Aegis net (E)" disabled><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.5l5.6 3.2v6.6L8 14.5l-5.6-3.2V4.7z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg><b id="aegisV">0%</b><i id="aegisFill"></i></button>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P)">II</button>
  <button id="musicBtn" class="hbtn tog" type="button" aria-label="Turn music on (M)" aria-pressed="false" title="Music (M)">&#9835;</button>
  <button id="muteBtn" class="hbtn tog" type="button" aria-label="Turn sound effects on (N)" aria-pressed="false" title="Sound effects (N)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q1.6 2.5 0 5M12.8 4q2.8 4 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
</div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel">
    <h1 id="ovTitle">DECK GUARD</h1>
    <div id="ovSub" class="sub">Swarm Break</div>
    <p id="ovBody" class="pitch"></p>
    <div id="ovStats"></div>
    <div id="ovExtra"></div>
    <div class="row2"><button id="btnPrimary" class="btn primary" type="button">Scramble</button><button id="btnSecondary" class="btn" type="button" hidden>New run</button></div>
    <div class="legend">Drag or <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> fly &middot; guns fire on their own &middot; <kbd>E</kbd> Aegis &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> music &middot; <kbd>N</kbd> sound</div>
  </div>
</div>
<script>
'use strict';
(function () {
  // ─────────────────────────────── basics ───────────────────────────────
  const $ = (id) => document.getElementById(id);
  const W = 360, HUD_H = 46, RS = 3, CELL = 18, COLS = 20, TOP = 8;
  const cv = $('field'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  let vw = 360, vh = 640, dpr = 1, scale = 1, offX = 0, offY = HUD_H, T = 0;
  // Field geometry. The height follows the panel: a short, wide Preview gets the compact field.
  const DECK_H = 86, ISL_X = 184;
  let H = 580, DECK_Y = 494, ROWS = 27, DIVE_ROW = 26, ZONE_TOP = 404;
  function layout(h) {
    H = h; DECK_Y = H - DECK_H; ROWS = Math.floor((DECK_Y - TOP) / CELL);
    DIVE_ROW = ROWS - 1; ZONE_TOP = DECK_Y - 5 * CELL;
  }
  const colX = (c) => c * CELL + CELL / 2;
  const rowY = (r) => TOP + r * CELL + CELL / 2;

  // ─────────────────────────────── palettes ─────────────────────────────
  // Tiered colors per entity: highlight, mid, shadow, glow rgb.
  const PAL = {
    drone:  { hi: '#c8d2de', mid: '#6d7a8c', sh: '#2b3340', glow: '255,110,90' },
    head:   { hi: '#ffd2a8', mid: '#c0623a', sh: '#4e2014', glow: '255,90,60' },
    wreck:  { hi: '#8a8f97', mid: '#4a4f58', sh: '#1d2027', glow: '255,140,70' },
    missile:{ hi: '#ffffff', mid: '#b8c4d4', sh: '#4c5666', glow: '255,160,90' },
    jet:    { hi: '#e8f6ff', mid: '#7fb6d9', sh: '#2c4d66', glow: '127,227,255' },
    vehicle:{ hi: '#b9c48a', mid: '#6b7445', sh: '#2c3119', glow: '160,210,120' },
  };

  // ─────────────────────────────── sprites ───────────────────────────────
  // Everything is pre-rendered once at 3x and blitted. Drones have two rotor frames.
  function sprite(w, h, draw) { const c = mk(w * RS, h * RS), g = c.getContext('2d'); g.scale(RS, RS); draw(g); return c; }
  // Swarm classes: each has its own livery, pace and quirk (see SWARM below).
  const LIVERY = {
    raider:   { hi: '#c8d2de', mid: '#6d7a8c', sh: '#2b3340', eye: '#ffb34a', glow: '255,150,90', stripe: null },
    hornet:   { hi: '#ffe27a', mid: '#d19a1c', sh: '#4a3408', eye: '#ff3b2e', glow: '255,210,80', stripe: '#1a1408' },
    wraith:   { hi: '#c9b8ff', mid: '#5b4a9a', sh: '#1d1638', eye: '#9ff3ff', glow: '170,140,255', stripe: null },
    ironclad: { hi: '#b8d4ff', mid: '#3f5f96', sh: '#15233d', eye: '#7fe3ff', glow: '120,180,255', stripe: '#d4dce8' },
  };
  function droneSprite(kind, head, frame) {
    const p = LIVERY[kind];
    return sprite(20, 20, (g) => {
      // delta wing loitering munition, nose down
      const gr = g.createLinearGradient(0, 2, 0, 18); gr.addColorStop(0, p.hi); gr.addColorStop(0.5, p.mid); gr.addColorStop(1, p.sh);
      g.fillStyle = gr; g.beginPath(); g.moveTo(10, 18); g.lineTo(19, 5); g.lineTo(13, 6.5); g.lineTo(10, 2); g.lineTo(7, 6.5); g.lineTo(1, 5); g.closePath(); g.fill();
      if (p.stripe) { g.save(); g.clip(); g.fillStyle = p.stripe; for (let y = 4; y < 18; y += 4) g.fillRect(0, y, 20, 1.4); g.restore(); }
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 0.6; g.beginPath(); g.moveTo(10, 18); g.lineTo(19, 5); g.lineTo(13, 6.5); g.lineTo(10, 2); g.lineTo(7, 6.5); g.lineTo(1, 5); g.closePath(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(10, 3.5); g.lineTo(12, 7); g.lineTo(10, 12); g.closePath(); g.fill();
      if (head) { g.fillStyle = p.hi; g.beginPath(); g.moveTo(8, 9); g.lineTo(10, 4); g.lineTo(12, 9); g.closePath(); g.fill(); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(9.5, 5, 1, 5); }
      // pusher prop at the tail: two frames of blur
      g.fillStyle = 'rgba(220,230,240,.55)';
      if (frame) g.fillRect(6.5, 1.2, 7, 1.2); else g.fillRect(9.4, -0.2, 1.2, 3.6);
      // sensor eye: leaders carry a bigger one
      g.fillStyle = head ? '#ff3b2e' : p.eye; g.beginPath(); g.arc(10, 14.5, head ? 2.1 : 1.2, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(9.5, 14, 0.55, 0, 7); g.fill();
    });
  }
  const SWARM_SPR = {};
  for (const k of Object.keys(LIVERY)) SWARM_SPR[k] = { body: [droneSprite(k, false, 0), droneSprite(k, false, 1)], head: [droneSprite(k, true, 0), droneSprite(k, true, 1)] };
  function wreckSprite(stage) {
    const p = PAL.wreck;
    return sprite(18, 18, (g) => {
      const gr = g.createRadialGradient(8, 7, 1, 9, 9, 9); gr.addColorStop(0, p.hi); gr.addColorStop(0.6, p.mid); gr.addColorStop(1, p.sh);
      g.fillStyle = gr; g.beginPath();
      const pts = [[2, 11], [4, 4], [9, 2], [15, 4], [16.5, 10], [13, 16], [6, 16]];
      pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.7; g.stroke();
      g.strokeStyle = 'rgba(20,20,24,.8)'; g.lineWidth = 0.8;
      for (let k = 0; k < stage; k++) { g.beginPath(); g.moveTo(4 + k * 4, 5); g.lineTo(7 + k * 3, 10); g.lineTo(5 + k * 4, 14); g.stroke(); }
      g.fillStyle = 'rgba(255,150,70,.9)'; g.beginPath(); g.arc(9, 9, 1.4 + (3 - stage) * 0.4, 0, 7); g.fill();
    });
  }
  const WRECK = [wreckSprite(0), wreckSprite(1), wreckSprite(2)];
  // Baba Yaga: a heavy six-rotor bomber drone. Body, arms and motor pods are baked; the rotors spin live.
  const YAGA_ARMS = [[-34, -6], [-24, -16], [24, -16], [34, -6], [-22, 10], [22, 10]];
  const YAGA = sprite(90, 56, (g) => {
    g.translate(45, 26);
    g.strokeStyle = '#1c2016'; g.lineWidth = 3.4; g.lineCap = 'round';
    for (const [x, y] of YAGA_ARMS) { g.beginPath(); g.moveTo(0, 0); g.lineTo(x, y); g.stroke(); }
    g.strokeStyle = '#4b5534'; g.lineWidth = 1.2; for (const [x, y] of YAGA_ARMS) { g.beginPath(); g.moveTo(0, -1); g.lineTo(x, y - 1); g.stroke(); }
    for (const [x, y] of YAGA_ARMS) { const m = g.createRadialGradient(x - 1, y - 1, 0.5, x, y, 4.4); m.addColorStop(0, '#9aa17c'); m.addColorStop(1, '#1a1d12'); g.fillStyle = m; g.beginPath(); g.arc(x, y, 4.2, 0, 7); g.fill(); }
    const b = g.createLinearGradient(0, -14, 0, 14); b.addColorStop(0, '#8e976a'); b.addColorStop(0.5, '#4a5433'); b.addColorStop(1, '#1b2012');
    g.fillStyle = b; rr(g, -15, -11, 30, 20, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.8; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.18)'; rr(g, -12, -9, 24, 5, 3); g.fill();
    // battery pack and GPS mast
    g.fillStyle = '#2a2f22'; rr(g, -7, -15, 14, 5, 2); g.fill(); g.fillStyle = '#c9d1a8'; g.fillRect(-0.6, -21, 1.2, 6); g.beginPath(); g.arc(0, -21, 1.8, 0, 7); g.fill();
    // bomb rack underneath: four tail-finned bombs
    g.fillStyle = '#1a1d14'; g.fillRect(-14, 9, 28, 3);
    for (let i = 0; i < 4; i++) { const x = -10.5 + i * 7; g.fillStyle = '#5c6245'; rr(g, x - 2.2, 11, 4.4, 10, 2); g.fill(); g.fillStyle = '#c8102e'; g.fillRect(x - 2.2, 13, 4.4, 1); g.fillStyle = '#2a2d20'; g.beginPath(); g.moveTo(x - 3, 11); g.lineTo(x + 3, 11); g.lineTo(x, 13.5); g.fill(); }
    // camera turret and night-vision lamps
    g.fillStyle = '#10130c'; g.beginPath(); g.arc(0, 4, 4, 0, 7); g.fill(); g.fillStyle = '#7fe37a'; g.beginPath(); g.arc(0, 4, 1.7, 0, 7); g.fill();
    g.fillStyle = 'rgba(160,255,150,.85)'; g.beginPath(); g.arc(-10, 0, 1.3, 0, 7); g.fill(); g.beginPath(); g.arc(10, 0, 1.3, 0, 7); g.fill();
  });
  const BOMB = sprite(8, 16, (g) => {
    const b = g.createLinearGradient(1, 0, 7, 0); b.addColorStop(0, '#2f3324'); b.addColorStop(0.5, '#8a9168'); b.addColorStop(1, '#2f3324');
    g.fillStyle = b; rr(g, 1.5, 3, 5, 12, 2.5); g.fill(); g.fillStyle = '#c8102e'; g.fillRect(1.5, 11, 5, 1.2);
    g.fillStyle = '#1b1e14'; g.beginPath(); g.moveTo(0, 0); g.lineTo(8, 0); g.lineTo(4, 4); g.fill();
  });

      } else if (c.timer <= 0) {
        if (J && J.alive && Math.abs(J.x - c.x) < 30 && J.y > DECK_Y - 60 && Math.random() < 0.5) { c.state = 'wave'; c.timer = 1.2; }
        else { c.state = 'walk'; c.goal = clamp(c.x + rand(-80, 80), 8, W - 8); }
      }
    }
    if (G.cheerT > 0) G.cheerT -= dt;
    tug.x += tug.dir * 16 * dt; if (tug.x > W - 30 || tug.x < 30) tug.dir = -tug.dir;
  }
  function drawJet() {
    if (!J.alive) return;
    if (J.inv > 0 && Math.sin(T * 30) > 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(J.x, J.y + 14, 1, J.x, J.y + 14, 12 + Math.random() * 3); g.addColorStop(0, 'rgba(127,227,255,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(J.x, J.y + 14, 15, 0, 7); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(J.x, J.y); ctx.scale(1 - Math.abs(J.bank) * 0.35, 1); ctx.drawImage(JET, -15, -15, 30, 30); ctx.restore();
  }
  function drawShots() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#bff0ff'; for (const s of SHOTS) if (s.on) ctx.fillRect(s.x - 1, s.y - 6, 2, 10);
    ctx.strokeStyle = 'rgba(255,210,120,.9)'; ctx.lineWidth = 1.2;
    for (const t of TRACERS) if (t.on) { ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.x - t.vx * 0.014, t.y - t.vy * 0.014); ctx.stroke(); }
    ctx.restore();
    for (const k of interceptors) {
      ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(Math.atan2(k.vy, k.vx) + Math.PI / 2);
      ctx.fillStyle = '#eef3fa'; ctx.fillRect(-1.3, -6, 2.6, 11); ctx.fillStyle = '#ff5a3a'; ctx.fillRect(-1.3, 5, 2.6, 2);
      ctx.restore();
    }
  }
  function drawFx() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of PARTS) if (p.on) {
      const a = p.life / p.max;
      ctx.globalAlpha = Math.min(1, a * 1.4); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.kind === 2 ? 1 + (1 - a) * 1.5 : a * 0.6 + 0.4), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const r of RINGS) if (r.on) {
      const a = r.life / r.max;
      ctx.strokeStyle = `rgba(${r.color},${(a * 0.9).toFixed(3)})`; ctx.lineWidth = r.width * a + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1.15 - a * 0.9), 0, 7); ctx.stroke();
    }
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of TEXTS) if (t.on) {
      const a = t.life / t.max, pop = 1 + Math.max(0, a - 0.8) * 2.5;
      ctx.font = `900 ${Math.round(t.size * pop)}px ui-sans-serif,system-ui,"Segoe UI",Arial`;
      ctx.lineWidth = 3; ctx.strokeStyle = `rgba(2,6,14,${(a * 0.8).toFixed(3)})`; ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = `rgba(${t.color},${Math.min(1, a * 1.6).toFixed(3)})`; ctx.fillText(t.str, t.x, t.y);
    }
  }
  function elastic(t) { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.pow(2, -9 * t) * Math.cos(t * 12); }
  function drawBanners() {
    let y = H * 0.36;
    for (const b of G.banners) {
      const t = b.t, a = Math.min(1, t * 5, (b.life - t) * 3), sc = 0.7 + 0.3 * elastic(Math.min(1, t * 2.2));
      ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = 'rgba(2,6,14,.66)'; rr(ctx, -155, -24, 310, 50, 12); ctx.fill();
      ctx.strokeStyle = `rgba(${b.color},.6)`; ctx.lineWidth = 1.2; ctx.stroke();
      const g = ctx.createLinearGradient(-120, 0, 120, 0); g.addColorStop(0, '#7fe3ff'); g.addColorStop(0.5, '#eaf2ff'); g.addColorStop(1, '#ffcf5a');
      ctx.fillStyle = g; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 19px ui-sans-serif,system-ui,"Segoe UI",Arial'; ctx.fillText(b.text, 0, -6, 290);
      ctx.fillStyle = `rgba(${b.color},1)`; ctx.font = '800 11px ui-sans-serif,system-ui,"Segoe UI",Arial'; ctx.fillText(b.sub, 0, 14, 290);
      ctx.restore(); y += 58;
    }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    if (S) {
      const sh = G.shake, sx = sh > 0.2 ? rand(-sh, sh) : 0, sy = sh > 0.2 ? rand(-sh, sh) : 0;
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (offX + sx) * dpr, (offY + sy) * dpr);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
      ctx.fillStyle = 'rgba(4,10,22,.35)'; ctx.fillRect(0, 0, W, H);
      drawSea();
      ctx.strokeStyle = 'rgba(127,227,255,.07)'; ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.moveTo(0, ZONE_TOP - 16); ctx.lineTo(W, ZONE_TOP - 16); ctx.stroke(); ctx.setLineDash([]);
      drawWrecks(); drawSwarm(); drawMotherships(); drawScouts(); drawDeck(); drawDivers(); drawMissiles(); drawShots(); drawJet(); drawFx(); drawBanners();
      ctx.restore();
      ctx.strokeStyle = 'rgba(127,227,255,.3)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, H - 2);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    if (VIG) ctx.drawImage(VIG, 0, 0, vw, vh);
    if (G.flash > 0.01) { ctx.fillStyle = `rgba(${G.flashC},${(G.flash * 0.5).toFixed(3)})`; ctx.fillRect(0, 0, vw, vh); }
  }

  // ─────────────────────────────── HUD + overlays ───────────────────────────
  const hudCache = {};
  function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
  function bumpChip(id) { const c = $(id).parentNode; if (!c || !c.classList) return; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  function updateHud(force) {
    if (!S) return;
    if (force) for (const k in hudCache) delete hudCache[k];
    setText('hullV', String(S.hull)); setText('livesV', String(Math.max(0, S.lives))); setText('scoreV', fmt(G.shownScore));
    const low = S.hull <= 3; if (hudCache.low !== low) { hudCache.low = low; $('hullChip').classList.toggle('low', low); }
    const m = MISSIONS[S.mi];
    if (m) {
      const v = Math.min(m.n, Math.max(0, missionValue(m)));
      setText('goalN', `GOAL ${S.mi + 1}/${MISSIONS.length}`); setText('goalT', m.t); setText('goalP', `${v}/${m.n}`);
      const w = `${Math.round(v / m.n * 100)}%`; if (hudCache.fill !== w) { hudCache.fill = w; $('goalFill').style.width = w; }
    } else { setText('goalN', 'ENDLESS'); setText('goalT', `Hold the line · wave ${G.wave}`); setText('goalP', `${S.downed} down`); }
    const pct = Math.round(S.aegis * 100), ready = S.aegis >= 1 && G.mode === 'play';
    setText('aegisV', ready ? 'GO' : pct + '%');
    if (hudCache.ae !== pct) { hudCache.ae = pct; $('aegisFill').style.width = pct + '%'; }
    if (hudCache.ready !== ready) { hudCache.ready = ready; $('aegisBtn').disabled = !ready; $('aegisBtn').classList.toggle('ready', ready); }
  }
  function threatsHtml() {
    const t = [['#ff8a5a', 'DRONE SWARMS', 'Chains snake down lane by lane. Hit one and it splits; the one behind leads. Wrecks turn them.'],
      ['#ff5a6a', 'HYPERSONIC MISSILES', 'Launch, boost, weaving glide, terminal dive with a red reticle on its target. Kill it in the glide for a bonus.'],
      ['#8fe07a', 'DECK MINIGUNS', 'The parked trucks and tracked vehicles shoot on their own at anything near the deck. They overheat.'],
      ['#a0ff96', 'BABA YAGA MOTHERSHIPS', 'Heavy six-rotor bombers patrol the top, drop bombs on the deck and launch Hornet swarms. Pour fire into them.'],
      ['#7fe3ff', 'AEGIS NET', 'Kills charge it. Press E to launch radar-guided interceptors at missiles and swarm leaders.']];
    return `<div class="threats">${t.map(([c, h, d]) => `<div class="th" style="--c:${c}"><b>${h}</b>${d}</div>`).join('')}</div>`;
  }
  function ladderHtml() { return `<ul class="ladder">${MISSIONS.map((m, i) => `<li class="${i < S.done ? 'ok' : ''}"><span>${i < S.done ? '&#10003;' : '&middot;'}</span>${i + 1}. ${m.t}</li>`).join('')}</ul>`; }
  function statsHtml() {
    return [['SCORE', fmt(S.score)], ['DOWNED', String(S.downed)], ['MISSILES', String(S.missiles)], ['MISSIONS', `${S.done}/${MISSIONS.length}`]]
      .map(([l, v]) => `<div><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
  }
  let primaryAct = null, secondaryAct = null;
  function showOverlay(o) {
    $('ovTitle').textContent = o.title; $('ovTitle').className = o.bad ? 'bad' : '';
    $('ovSub').textContent = o.sub || ''; $('ovBody').innerHTML = o.body || '';
    $('ovStats').innerHTML = o.stats ? statsHtml() : ''; $('ovExtra').innerHTML = o.extra || '';
    $('btnPrimary').textContent = o.primary; primaryAct = o.onPrimary;
    const sec = $('btnSecondary'); sec.hidden = !o.secondary; sec.textContent = o.secondary || ''; secondaryAct = o.onSecondary || null;
    $('overlay').hidden = false;
    try { $('btnPrimary').focus(); } catch (e) { /* not focusable here */ }
  }
  function hideOverlay() { $('overlay').hidden = true; }
  function titleScreen() {
    G.mode = 'title'; G.auto = true; newRun();
    showOverlay({ title: 'DECK GUARD', sub: 'Swarm Break',
      body: 'Drone swarms are snaking down on your carrier and <b>hypersonic missiles</b> are inbound. Fly the interceptor, split the swarms, and let the <b>deck miniguns</b> and the <b>Aegis net</b> cover you.',
      extra: threatsHtml(), primary: 'Scramble', onPrimary: startRun });
  }
  function startRun() { audioStart(); G.auto = false; G.mode = 'play'; newRun(); hideOverlay(); }
  function pause() { if (G.mode !== 'play') return; G.mode = 'paused'; showOverlay({ title: 'PAUSED', sub: `Wave ${G.wave} · ${G.waveName}`, stats: true, extra: ladderHtml(), primary: 'Resume', onPrimary: resume, secondary: 'New run', onSecondary: startRun }); }
  function resume() { audioStart(); G.mode = 'play'; hideOverlay(); }
  function gameOver() {
    G.mode = 'over'; SFX.over();
    showOverlay({ title: S.hull <= 0 ? 'CARRIER CRIPPLED' : 'NO INTERCEPTORS', bad: true, sub: `Fell at wave ${G.wave} · ${G.waveName}`, stats: true,
      body: S.done ? `You finished <b>${S.done} of ${MISSIONS.length}</b> missions and downed <b>${S.downed}</b> drones.` : 'Split the swarms high, before they reach the deck lanes, and save the Aegis for a terminal dive.',
      extra: ladderHtml(), primary: 'Scramble again', onPrimary: startRun });
  }
  function victory() {
    G.mode = 'won'; SFX.win(); flash(0.5, '200,240,255'); shake(6);
    for (let i = 0; i < 80; i++) part(rand(0, W), rand(-20, 60), rand(-60, 60), rand(40, 180), rand(1.6, 3), rand(2.5, 4.5), pick(['#7fe3ff', '#ffcf5a', '#8fe07a', '#ffffff']), 0);
    showOverlay({ title: 'LINE HELD', sub: 'The Grand Swarm is broken', stats: true,
      body: `All <b>${MISSIONS.length}</b> missions done. The carrier survived with <b>${S.hull}</b> hull and <b>${S.missiles}</b> hypersonic kills. Keep flying in endless waves, or start fresh.`,
      primary: 'Keep flying', onPrimary: () => { audioStart(); G.endless = true; G.mode = 'play'; hideOverlay(); }, secondary: 'New run', onSecondary: startRun });
  }

  // ─────────────────────────────── input ───────────────────────────────
  // The jet flies to a point just above your finger, so the finger never covers it.
  function toField(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
  let dragging = false;
  cv.addEventListener('pointerdown', (e) => { audioStart(); if (G.mode !== 'play' || !J) return; dragging = true; const p = toField(e); J.tx = p.x; J.ty = p.y - 36; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* optional */ } });
  cv.addEventListener('pointermove', (e) => { if (G.mode !== 'play' || !J) return; if (!dragging && e.pointerType !== 'mouse') return; const p = toField(e); J.tx = p.x; J.ty = p.y - (e.pointerType === 'mouse' ? 0 : 36); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  $('btnPrimary').addEventListener('click', () => { if (primaryAct) primaryAct(); });
  $('btnSecondary').addEventListener('click', () => { if (secondaryAct) secondaryAct(); });
  $('pauseBtn').addEventListener('click', () => { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); });
  $('musicBtn').addEventListener('click', () => { audioStart(); setMusic(!A.musicOn); });
  $('muteBtn').addEventListener('click', () => { audioStart(); setSound(!A.sfxOn); });
  $('aegisBtn').addEventListener('click', () => fireAegis());
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
  window.addEventListener('keydown', (e) => {
    const c = e.code;
    if (KEYMAP[c]) { keys[KEYMAP[c]] = true; e.preventDefault(); return; }
    if (c === 'Space' || c === 'Enter') { if (G.mode !== 'play' && primaryAct) { e.preventDefault(); primaryAct(); } else e.preventDefault(); }
    else if (c === 'KeyE') fireAegis();
    else if (c === 'KeyP' || c === 'Escape') { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyM') { audioStart(); setMusic(!A.musicOn); }
    else if (c === 'KeyN') { audioStart(); setSound(!A.sfxOn); }
    else if (c === 'KeyR') { if (G.mode === 'paused' || G.mode === 'over' || G.mode === 'won') startRun(); }
  });
  window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.mode === 'play') pause(); });

  // ─────────────────────────────── loop ───────────────────────────────
  let last = 0;
  function frame(ts) {
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
    last = ts;
    update(dt); updateHud(false); render(); audioTick();
    requestAnimationFrame(frame);
  }
  // A small handle for automated playtests. Nothing in the game reads it.
  window.__deckGuard = {
    state: () => ({ mode: G.mode, wave: G.wave, score: S && S.score, hull: S && S.hull, lives: S && S.lives, mission: S && S.mi + 1, done: S && S.done, downed: S && S.downed, missiles: S && S.missiles, segs: segs.length, divers: divers.length, inbound: missiles.length, yagas: motherships.length, bombs: bombs.length, wrecks: wrecks.size, aegis: S && S.aegis }),
    autopilot: (on) => { G.auto = !!on; },
    invulnerable: (on) => { G.godTest = !!on; },
    clearWave: () => { for (const s of segs.slice()) killSeg(s, false); divers = []; for (const b of motherships) hurtMothership(b, 999); G.mothershipsLeft = 0; },
    spawnMothership: () => spawnMothership(motherships.length),
    launchMissile: () => launchMissile(),
  };
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
