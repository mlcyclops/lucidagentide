<!-- Deck Guard: Swarm Break. An original arcade shooter: drone swarms snake down toward a carrier deck, hypersonic missiles fly their full boost, glide and dive profile, and you hold the line with your interceptor, the carrier's radar-guided interceptor net and the auto-miniguns on the parked vehicles. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DECK GUARD</title>
<style>
:root{--bg:#04070e;--ink:#eaf2ff;--dim:#8a97b3;--sea:#1d5d8f;--gold:#ffcf5a;--cyan:#7fe3ff;--red:#ff5a6a;--green:#8fe07a;--panel:rgba(7,12,24,.92)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(8,14,28,.64);border:1px solid rgba(127,227,255,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#hullV{color:var(--green)}
#hullChip.low #hullV{color:var(--red)}
#livesV{color:var(--cyan)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,207,90,.42)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--cyan);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px rgba(255,207,90,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,207,90,.95);border-color:var(--gold)}100%{box-shadow:none}}
.chip.bump{animation:bump .38s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(8,14,28,.7);border:1px solid rgba(127,227,255,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 12px rgba(127,227,255,.45);outline:none}
.hbtn svg{display:block;margin:auto}
.hbtn.tog[aria-pressed="false"]{color:var(--dim);background:linear-gradient(135deg,transparent 46%,rgba(255,90,106,.75) 47%,rgba(255,90,106,.75) 53%,transparent 54%),rgba(8,14,28,.7)}
#aegisBtn{position:fixed;right:10px;bottom:10px;z-index:6;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;color:var(--ink);font:900 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.16em;background:rgba(8,14,28,.72);border:1px solid rgba(127,227,255,.4);overflow:hidden}
#aegisBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#aegisBtn.ready{border-color:var(--cyan);box-shadow:0 0 18px rgba(127,227,255,.55);animation:ready 1s ease-in-out infinite alternate}
#aegisBtn:disabled{cursor:default;color:var(--dim)}
@keyframes ready{from{box-shadow:0 0 8px rgba(127,227,255,.35)}to{box-shadow:0 0 22px rgba(127,227,255,.85)}}
@media (max-width:430px){.chip .lbl{font-size:8px;letter-spacing:.08em}.chip{padding:0 6px;gap:4px}.chip.goal .gn{display:none}.hbtn{width:28px}.chip .sl{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,5,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{background:var(--panel);border:1px solid rgba(127,227,255,.32);border-radius:18px;padding:16px 18px 14px;width:min(540px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(127,227,255,.14),inset 0 0 60px rgba(14,30,60,.6)}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:4px 0 2px;background:linear-gradient(90deg,#7fe3ff 0%,#dfefff 40%,#ffcf5a 70%,#ff7a5a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(127,227,255,.4))}
h1.bad{background:linear-gradient(90deg,#ff5a6a,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--gold);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#c9d6ef;max-width:54ch;margin:0 auto 8px}
.pitch b{color:var(--gold)}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:5px;margin:2px 0 8px;text-align:left}
.th{position:relative;font-size:11.5px;line-height:1.35;color:#c9d6ef;padding:6px 9px 6px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.th::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.th b{display:block;font-size:10.5px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--cyan);background:rgba(127,227,255,.08);border:1px solid rgba(127,227,255,.45)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(127,227,255,.16),rgba(127,227,255,.04));border:1px solid rgba(127,227,255,.5)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(127,227,255,.5);outline:none}
.btn.primary{font-size:16px;padding:13px 34px;background:linear-gradient(180deg,rgba(255,207,90,.26),rgba(127,227,255,.06));border-color:rgba(255,207,90,.7);box-shadow:0 0 18px rgba(255,207,90,.28)}
#ovStats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:62px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#bff5a8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
@media (max-height:820px){.panel{padding:10px 16px}h1{font-size:clamp(24px,5.6vh,40px);margin:2px 0}.pitch{font-size:12px;line-height:1.4;margin-bottom:6px}.th{font-size:10.5px;padding:4px 8px 4px 11px}.ladder li{font-size:10.5px}#ovStats .val{font-size:18px}.btn.primary{padding:10px 30px;font-size:15px}.legend{margin-top:4px;line-height:1.8;font-size:10.5px}}
@media (max-height:600px){.threats,.ladder,.pitch{display:none}h1{font-size:30px}}
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="Deck Guard playfield: move your interceptor with the pointer or arrow keys; its guns fire automatically"></canvas>
<div id="hud">
  <div class="chip" id="hullChip" title="Carrier hull"><span class="lbl">HULL</span><b id="hullV">10</b></div>
  <div class="chip" title="Interceptors left"><span class="lbl">JETS</span><b id="livesV">3</b></div>
  <div class="chip" title="Score"><span class="lbl sl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Down 15 drones</span><span class="gp" id="goalP">0/15</span><i id="goalFill"></i></div>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P)">II</button>
  <button id="musicBtn" class="hbtn tog" type="button" aria-label="Turn music on (M)" aria-pressed="false" title="Music (M)">&#9835;</button>
  <button id="muteBtn" class="hbtn tog" type="button" aria-label="Turn sound effects on (N)" aria-pressed="false" title="Sound effects (N)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q1.6 2.5 0 5M12.8 4q2.8 4 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
</div>
<button id="aegisBtn" type="button" aria-label="Fire the Aegis interceptor net (E)" title="Aegis net (E)" disabled><span>AEGIS</span><b id="aegisV">0%</b><i id="aegisFill"></i></button>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel">
    <h1 id="ovTitle">DECK GUARD</h1>
    <div id="ovSub" class="sub">Swarm Break</div>
    <p id="ovBody" class="pitch"></p>
    <div id="ovStats"></div>
    <div id="ovExtra"></div>
    <div class="row2"><button id="btnPrimary" class="btn primary" type="button">Scramble</button><button id="btnSecondary" class="btn" type="button" hidden>New run</button></div>
    <div class="legend">Drag or <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> fly &middot; guns fire on their own &middot; <kbd>E</kbd> Aegis &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> music &middot; <kbd>N</kbd> sound</div>
  </div>
</div>
<script>
'use strict';
(function () {
  // ─────────────────────────────── basics ───────────────────────────────
  const $ = (id) => document.getElementById(id);
  const W = 360, HUD_H = 46, RS = 3, CELL = 18, COLS = 20, TOP = 8;
  const cv = $('field'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  let vw = 360, vh = 640, dpr = 1, scale = 1, offX = 0, offY = HUD_H, T = 0;
  // Field geometry. The height follows the panel: a short, wide Preview gets the compact field.
  let H = 580, DECK_Y = 516, ROWS = 28, DIVE_ROW = 25, ZONE_TOP = 420;
  function layout(h) {
    H = h; DECK_Y = H - 64; ROWS = Math.floor((DECK_Y - TOP) / CELL);
    DIVE_ROW = ROWS - 1; ZONE_TOP = DECK_Y - 5 * CELL;
  }
  const colX = (c) => c * CELL + CELL / 2;
  const rowY = (r) => TOP + r * CELL + CELL / 2;

  // ─────────────────────────────── palettes ─────────────────────────────
  // Tiered colors per entity: highlight, mid, shadow, glow rgb.
  const PAL = {
    drone:  { hi: '#c8d2de', mid: '#6d7a8c', sh: '#2b3340', glow: '255,110,90' },
    head:   { hi: '#ffd2a8', mid: '#c0623a', sh: '#4e2014', glow: '255,90,60' },
    wreck:  { hi: '#8a8f97', mid: '#4a4f58', sh: '#1d2027', glow: '255,140,70' },
    missile:{ hi: '#ffffff', mid: '#b8c4d4', sh: '#4c5666', glow: '255,160,90' },
    jet:    { hi: '#e8f6ff', mid: '#7fb6d9', sh: '#2c4d66', glow: '127,227,255' },
    vehicle:{ hi: '#b9c48a', mid: '#6b7445', sh: '#2c3119', glow: '160,210,120' },
  };

  // ─────────────────────────────── sprites ───────────────────────────────
  // Everything is pre-rendered once at 3x and blitted. Drones have two rotor frames.
  function sprite(w, h, draw) { const c = mk(w * RS, h * RS), g = c.getContext('2d'); g.scale(RS, RS); draw(g); return c; }
  function droneSprite(head, frame) {
    const p = head ? PAL.head : PAL.drone;
    return sprite(20, 20, (g) => {
      // delta wing loitering munition, nose down
      const gr = g.createLinearGradient(0, 2, 0, 18); gr.addColorStop(0, p.hi); gr.addColorStop(0.5, p.mid); gr.addColorStop(1, p.sh);
      g.fillStyle = gr; g.beginPath(); g.moveTo(10, 18); g.lineTo(19, 5); g.lineTo(13, 6.5); g.lineTo(10, 2); g.lineTo(7, 6.5); g.lineTo(1, 5); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 0.6; g.stroke();
      g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(10, 3.5); g.lineTo(12, 7); g.lineTo(10, 12); g.closePath(); g.fill();
      // pusher prop at the tail: two frames of blur
      g.fillStyle = 'rgba(220,230,240,.55)';
      if (frame) g.fillRect(6.5, 1.2, 7, 1.2); else g.fillRect(9.4, -0.2, 1.2, 3.6);
      // sensor eye
      g.fillStyle = head ? '#ff3b2e' : '#ffb34a'; g.beginPath(); g.arc(10, 14.5, head ? 1.9 : 1.2, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(9.5, 14, 0.5, 0, 7); g.fill();
    });
  }
  const DRONE = [droneSprite(false, 0), droneSprite(false, 1)], HEAD = [droneSprite(true, 0), droneSprite(true, 1)];
  function wreckSprite(stage) {
    const p = PAL.wreck;
    return sprite(18, 18, (g) => {
      const gr = g.createRadialGradient(8, 7, 1, 9, 9, 9); gr.addColorStop(0, p.hi); gr.addColorStop(0.6, p.mid); gr.addColorStop(1, p.sh);
      g.fillStyle = gr; g.beginPath();
      const pts = [[2, 11], [4, 4], [9, 2], [15, 4], [16.5, 10], [13, 16], [6, 16]];
      pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.7; g.stroke();
      g.strokeStyle = 'rgba(20,20,24,.8)'; g.lineWidth = 0.8;
      for (let k = 0; k < stage; k++) { g.beginPath(); g.moveTo(4 + k * 4, 5); g.lineTo(7 + k * 3, 10); g.lineTo(5 + k * 4, 14); g.stroke(); }
      g.fillStyle = 'rgba(255,150,70,.9)'; g.beginPath(); g.arc(9, 9, 1.4 + (3 - stage) * 0.4, 0, 7); g.fill();
    });
  }
  const WRECK = [wreckSprite(0), wreckSprite(1), wreckSprite(2)];
  const MISSILE = sprite(12, 44, (g) => {
    const p = PAL.missile, gr = g.createLinearGradient(1, 0, 11, 0); gr.addColorStop(0, p.sh); gr.addColorStop(0.45, p.hi); gr.addColorStop(1, p.sh);
    g.fillStyle = gr; g.beginPath(); g.moveTo(6, 44); g.lineTo(9.2, 30); g.lineTo(9.2, 6); g.lineTo(11.5, 1.5); g.lineTo(0.5, 1.5); g.lineTo(2.8, 6); g.lineTo(2.8, 30); g.closePath(); g.fill();
    g.fillStyle = '#39414f'; g.beginPath(); g.moveTo(2.8, 8); g.lineTo(0, 2); g.lineTo(2.8, 4); g.fill(); g.beginPath(); g.moveTo(9.2, 8); g.lineTo(12, 2); g.lineTo(9.2, 4); g.fill();
    g.fillStyle = '#c8102e'; g.fillRect(2.8, 26, 6.4, 1.4);
  });
  const JET = sprite(30, 30, (g) => {
    const p = PAL.jet, gr = g.createLinearGradient(0, 4, 0, 28); gr.addColorStop(0, p.hi); gr.addColorStop(0.5, p.mid); gr.addColorStop(1, p.sh);
    g.fillStyle = gr; g.beginPath(); g.moveTo(15, 1); g.lineTo(17.2, 10); g.lineTo(29, 19); g.lineTo(29, 22); g.lineTo(17.4, 19); g.lineTo(17.6, 25); g.lineTo(21.5, 28.5); g.lineTo(8.5, 28.5); g.lineTo(12.4, 25); g.lineTo(12.6, 19); g.lineTo(1, 22); g.lineTo(1, 19); g.lineTo(12.8, 10); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 0.6; g.stroke();
    g.fillStyle = '#12304a'; g.beginPath(); g.ellipse(15, 9, 1.9, 4, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(127,227,255,.9)'; g.fillRect(14.3, 6, 1.1, 3);
    g.fillStyle = '#ffcf5a'; g.fillRect(3, 19.2, 4, 1); g.fillRect(23, 19.2, 4, 1);
  });
  // parked vehicles: a wheeled light tactical truck and a tracked fighting vehicle, each with a minigun mount
  function vehicleSprite(kind, dead) {
    return sprite(40, 22, (g) => {
      const p = PAL.vehicle, gr = g.createLinearGradient(0, 4, 0, 20);
      gr.addColorStop(0, dead ? '#5a5a5a' : p.hi); gr.addColorStop(0.5, dead ? '#343434' : p.mid); gr.addColorStop(1, dead ? '#161616' : p.sh);
      g.fillStyle = gr;
      if (kind === 'truck') {
        rr(g, 3, 7, 34, 9, 2.4); g.fill(); g.beginPath(); g.moveTo(8, 7); g.lineTo(12, 3); g.lineTo(28, 3); g.lineTo(31, 7); g.closePath(); g.fill();
        g.fillStyle = '#10151d'; for (const x of [9, 31]) { g.beginPath(); g.arc(x, 17, 3.6, 0, 7); g.fill(); g.fillStyle = '#5a6270'; g.beginPath(); g.arc(x, 17, 1.4, 0, 7); g.fill(); g.fillStyle = '#10151d'; }
        g.fillStyle = 'rgba(127,227,255,.55)'; g.fillRect(13, 4.2, 5, 2.4); g.fillRect(20, 4.2, 5, 2.4);
      } else {
        rr(g, 2, 8, 36, 8, 2); g.fill(); g.beginPath(); g.moveTo(4, 8); g.lineTo(8, 3.5); g.lineTo(33, 3.5); g.lineTo(37, 8); g.closePath(); g.fill();
        g.fillStyle = '#10151d'; rr(g, 2, 15, 36, 5.5, 2.7); g.fill();
        g.fillStyle = '#4a5260'; for (let x = 5; x < 37; x += 5) { g.beginPath(); g.arc(x, 17.7, 1.6, 0, 7); g.fill(); }
      }
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 0.6; rr(g, 2.5, 3, 35, 13, 2); g.stroke();
      g.fillStyle = dead ? '#222' : '#2c3119'; rr(g, 16, 0, 8, 4.5, 1.5); g.fill();
    });
  }
  const VEH = { truck: vehicleSprite('truck', false), track: vehicleSprite('track', false), truckX: vehicleSprite('truck', true), trackX: vehicleSprite('track', true) };
  // ─────────────────────────────── background ─────────────────────────────
  const STARS = [[], [], []];
  for (let l = 0; l < 3; l++) for (let i = 0; i < [70, 38, 18][l]; i++) STARS[l].push({ x: Math.random(), y: Math.random() * 0.6, s: [0.7, 1.1, 1.7][l], ph: Math.random() * 7, sp: rand(0.8, 2.6) });
  function bakeCloud(w, h) {
    const c = mk(w, h), g = c.getContext('2d');
    for (let k = 0; k < 7; k++) {
      const x = rand(w * 0.2, w * 0.8), y = rand(h * 0.35, h * 0.65), r = rand(h * 0.25, h * 0.5);
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(110,140,190,.12)'); gr.addColorStop(1, 'rgba(110,140,190,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
    return c;
  }
  const CLOUDS = Array.from({ length: 4 }, () => ({ img: bakeCloud(260, 110), x: Math.random(), y: rand(0.08, 0.5), sp: rand(0.004, 0.012), sc: rand(0.8, 1.5) }));
  let VIG = null, DECK = null;
  function bakeVignette() {

  // ─────────────────────────────── the swarm ───────────────────────────────

  function killSeg(s, byMg) {

    }
  }
  function pickTarget(x) {

    opts.sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x));

  function stepDivers(dt) {

  // ─────────────────────────────── hypersonic missiles ───────────────────────────

  function stepMissiles(dt) {

  // ─────────────────────────────── scouts ───────────────────────────────
  function stepScouts(dt) {
    for (const s of scouts) {
      s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y < ZONE_TOP - 20 || s.y > DECK_Y - 12) s.vy = -s.vy;

      if (s.x < -30 || s.x > W + 30) s.dead = true;
    }
    scouts = scouts.filter((s) => !s.dead);
  }

  // ─────────────────────────────── the parked vehicles' miniguns ───────────────────────────
  function mgTargets(v) {
    const R = 230, out = [];
    const near = (x, y) => (x - v.x) ** 2 + (y - v.y) ** 2 < R * R;
    for (const d of divers) if (near(d.x, d.y)) out.push({ x: d.x, y: d.y, vx: d.vx, vy: d.vy, pri: 0 });
    for (const m of missiles) if (m.phase === 'terminal' && near(m.x, m.y)) out.push({ x: m.x, y: m.y, vx: 0, vy: 0, pri: -1 });
    for (const s of scouts) if (near(s.x, s.y)) out.push({ x: s.x, y: s.y, vx: s.vx, vy: s.vy, pri: 1 });
    for (const s of segs) if (!s.entering && s.y > DECK_Y - 230 && near(s.x, s.y)) out.push({ x: s.x, y: s.y, vx: s.dir * s.sp, vy: 0, pri: 2 });

  }
  function stepVehicles(dt) {

  // One projectile at (x, y): the first thing it touches takes `dmg`. Returns true when it hit something.

  // ─────────────────────────────── the player's interceptor + Aegis ───────────────────────────

  function fireAegis() {

    ring(W * 0.46 + 19, DECK_Y + 10, 420, '127,227,255', 1.1, 4);
    const targets = missiles.filter((m) => m.phase !== 'warn').map((m) => ({ m }))
      .concat(segs.filter((s) => s.head).map((s) => ({ s })), divers.map((d) => ({ d })), segs.filter((s) => !s.head).slice(0, 8).map((s) => ({ s })));

  function autopilot() {

  // ─────────────────────────────── the frame ───────────────────────────────
  function waveCleared() {
    S.waves++; if (S.waveHullHit === 0) S.cleanWaves++;
    addScore(1000 * G.wave, W / 2, H * 0.4, '127,227,255');
    G.banners.push({ text: 'WAVE CLEARED', sub: S.waveHullHit === 0 ? 'NO HULL DAMAGE' : `+${fmt(1000 * G.wave)}`, t: 0, life: 1.8, color: '143,224,122' });
    for (const m of missiles) { m.dead = true; explode(m.x, m.y, false); }
    missiles = []; scouts = []; flash(0.2, '200,255,220'); SFX.mission();
    G.pendingWave = true; G.waveT = 2.2;

  }
  function update(dt) {

    showOverlay({ title: 'LINE HELD', sub: 'The Grand Swarm is broken', stats: true,
      body: `All <b>${MISSIONS.length}</b> missions done. The carrier survived with <b>${S.hull}</b> hull and <b>${S.missiles}</b> hypersonic kills. Keep flying in endless waves, or start fresh.`,
      primary: 'Keep flying', onPrimary: () => { audioStart(); G.endless = true; G.mode = 'play'; hideOverlay(); }, secondary: 'New run', onSecondary: startRun });
  }

  // ─────────────────────────────── input ───────────────────────────────
  // The jet flies to a point just above your finger, so the finger never covers it.
  function toField(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
  let dragging = false;
  cv.addEventListener('pointerdown', (e) => { audioStart(); if (G.mode !== 'play' || !J) return; dragging = true; const p = toField(e); J.tx = p.x; J.ty = p.y - 36; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* optional */ } });
  cv.addEventListener('pointermove', (e) => { if (G.mode !== 'play' || !J) return; if (!dragging && e.pointerType !== 'mouse') return; const p = toField(e); J.tx = p.x; J.ty = p.y - (e.pointerType === 'mouse' ? 0 : 36); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  $('btnPrimary').addEventListener('click', () => { if (primaryAct) primaryAct(); });
  $('btnSecondary').addEventListener('click', () => { if (secondaryAct) secondaryAct(); });
  $('pauseBtn').addEventListener('click', () => { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); });
  $('musicBtn').addEventListener('click', () => { audioStart(); setMusic(!A.musicOn); });
  $('muteBtn').addEventListener('click', () => { audioStart(); setSound(!A.sfxOn); });
  $('aegisBtn').addEventListener('click', () => fireAegis());
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
  window.addEventListener('keydown', (e) => {
    const c = e.code;
    if (KEYMAP[c]) { keys[KEYMAP[c]] = true; e.preventDefault(); return; }
    if (c === 'Space' || c === 'Enter') { if (G.mode !== 'play' && primaryAct) { e.preventDefault(); primaryAct(); } else e.preventDefault(); }
    else if (c === 'KeyE') fireAegis();
    else if (c === 'KeyP' || c === 'Escape') { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyM') { audioStart(); setMusic(!A.musicOn); }
    else if (c === 'KeyN') { audioStart(); setSound(!A.sfxOn); }
    else if (c === 'KeyR') { if (G.mode === 'paused' || G.mode === 'over' || G.mode === 'won') startRun(); }
  });
  window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.mode === 'play') pause(); });

  // ─────────────────────────────── loop ───────────────────────────────
  let last = 0;
  function frame(ts) {
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
    last = ts;
    update(dt); updateHud(false); render(); audioTick();
    requestAnimationFrame(frame);
  }
  // A small handle for automated playtests. Nothing in the game reads it.
  window.__deckGuard = {
    state: () => ({ mode: G.mode, wave: G.wave, score: S && S.score, hull: S && S.hull, lives: S && S.lives, mission: S && S.mi + 1, done: S && S.done, downed: S && S.downed, missiles: S && S.missiles, segs: segs.length, divers: divers.length, inbound: missiles.length, wrecks: wrecks.size, aegis: S && S.aegis }),
    autopilot: (on) => { G.auto = !!on; },
    clearWave: () => { for (const s of segs.slice()) killSeg(s, false); divers = []; },
    launchMissile: () => launchMissile(),
  };
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
