<!-- Deck Guard: Deck the Halls. The holiday edition of Deck Guard: Krampus has hijacked the gift drones, and their swarms snake down on Santa's flight-deck workshop on a frozen night sea. Fly the candy interceptor, split the swarms, shoot candy-cane missiles out of their glide, unwrap presents, pick a workshop gift after every wave and break Krampus Prime. Music is a synthesized arrangement of the public-domain carol Deck the Halls that grows with the fight. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DECK GUARD: DECK THE HALLS</title>
<style>
:root{--bg:#040814;--ink:#f2f6ff;--dim:#9aa6c4;--gold:#ffd36b;--ice:#bfe9ff;--red:#ff4d5e;--green:#5fdc8f;--panel:rgba(8,12,28,.93)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(8,14,30,.66);border:1px solid rgba(191,233,255,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#hullV{color:var(--green)}
#hullChip.low #hullV{color:var(--red)}
#hullChip.low{border-color:rgba(255,77,94,.7);animation:lowpulse .8s ease-in-out infinite alternate}
@keyframes lowpulse{from{box-shadow:0 0 0 rgba(255,77,94,0)}to{box-shadow:0 0 14px rgba(255,77,94,.7)}}
#livesV{color:var(--ice)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,211,107,.42)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--ice);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:repeating-linear-gradient(135deg,#ff4d5e 0 6px,#fff 6px 12px);box-shadow:0 0 8px rgba(255,211,107,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,211,107,.95);border-color:var(--gold)}100%{box-shadow:none}}
.chip.bump{animation:bump .38s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(8,14,30,.72);border:1px solid rgba(191,233,255,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--gold);box-shadow:0 0 12px rgba(255,211,107,.45);outline:none}
.hbtn svg{display:block;margin:auto}
.hbtn.tog[aria-pressed="false"]{color:var(--dim);background:linear-gradient(135deg,transparent 46%,rgba(255,77,94,.75) 47%,rgba(255,77,94,.75) 53%,transparent 54%),rgba(8,14,30,.72)}
#netBtn{flex:none;position:relative;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;height:31px;padding:0 8px;border-radius:10px;color:var(--gold);font:900 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:rgba(8,14,30,.74);border:1px solid rgba(255,211,107,.4);overflow:hidden}
#netBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#netBtn.ready{border-color:var(--gold);animation:ready 1s ease-in-out infinite alternate}
#netBtn:disabled{cursor:default;color:var(--dim)}
#netBtn b{min-width:30px;text-align:right}
@keyframes ready{from{box-shadow:0 0 8px rgba(255,211,107,.35)}to{box-shadow:0 0 22px rgba(255,211,107,.9)}}
#netTouch{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:6;width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,211,107,.75);background:radial-gradient(circle at 40% 35%,rgba(255,211,107,.32),rgba(120,16,32,.6));color:#fff;font:900 14px/1.05 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.1em;touch-action:none;opacity:.88}
#netTouch small{display:block;font-size:10px;letter-spacing:.04em;opacity:.85;margin-top:2px}
#netTouch.ready{opacity:1;animation:ready 1s ease-in-out infinite alternate}
#netTouch:disabled{opacity:.42}
@media (max-width:460px){#hud{gap:4px;padding:7px 5px}.chip .lbl{display:none}.chip{padding:0 7px}.chip.goal .gn{display:none}.hbtn{width:27px}#netBtn{padding:0 6px}#netBtn b{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,5,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{position:relative;background:var(--panel);border:1px solid rgba(255,211,107,.34);border-radius:18px;padding:18px 18px 14px;width:min(560px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(255,211,107,.12),inset 0 0 60px rgba(20,30,70,.6)}
.panel::before{content:"";position:absolute;left:14px;right:14px;top:0;height:5px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(135deg,#ff4d5e 0 9px,#fff 9px 18px)}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:6px 0 2px;background:linear-gradient(90deg,#ff6a78 0%,#fff3f3 38%,#8ff0b0 66%,#ffd36b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,211,107,.35))}
h1.bad{background:linear-gradient(90deg,#ff4d5e,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--gold);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#cdd7ef;max-width:56ch;margin:0 auto 8px}
.pitch b{color:var(--gold)}
.bestline{display:inline-block;margin-top:6px;color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:11px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.howto div{position:relative;padding:8px 6px 7px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;line-height:1.35;color:#cdd7ef}
.howto i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:900;font-size:10.5px;margin-right:4px}
.howto b{display:inline-block;color:var(--gold);letter-spacing:.16em;font-size:11px;margin-bottom:3px}
.howto span{display:block}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:5px;margin:2px 0 8px;text-align:left}
.th{position:relative;font-size:11.5px;line-height:1.35;color:#cdd7ef;padding:6px 9px 6px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.th::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.th b{display:block;font-size:10.5px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.gifts{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:2px 0 6px}
.gifts span{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.05);border-left:4px solid var(--c);color:#dfe6f7}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--gold);background:rgba(255,211,107,.08);border:1px solid rgba(255,211,107,.45)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(191,233,255,.14),rgba(191,233,255,.03));border:1px solid rgba(191,233,255,.5)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(255,211,107,.5);outline:none}
.btn.primary{font-size:16px;padding:13px 34px;background:linear-gradient(180deg,rgba(255,77,94,.4),rgba(120,16,32,.25));border-color:rgba(255,211,107,.8);box-shadow:0 0 18px rgba(255,77,94,.3)}
#ovStats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:58px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:21px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#ovStats .val.new{color:var(--green)}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#b8f5c8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
.upg{font-size:11px;color:#cdd7ef;margin:6px 0 0;letter-spacing:.04em}
.upg b{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.card{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 7px 10px;border-radius:12px;color:var(--ink);font-family:inherit;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);text-align:center}
.card svg{width:42px;height:42px;flex:none}
.card div{display:flex;flex-direction:column;gap:3px}
.card b{font-size:11.5px;letter-spacing:.08em;color:var(--gold)}
.card span{font-size:11px;line-height:1.3;color:#cdd7ef}
.card em{font-style:normal;font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.card.sel,.card:hover,.card:focus-visible{border-color:var(--gold);box-shadow:0 0 20px rgba(255,211,107,.45);outline:none;background:rgba(255,211,107,.09)}
@media (max-width:440px){.cards{grid-template-columns:1fr;gap:6px}.card{flex-direction:row;text-align:left;padding:9px 10px}.card svg{width:34px;height:34px}.howto{grid-template-columns:1fr}}
@media (max-height:820px){.panel{padding:12px 16px 10px}h1{font-size:clamp(24px,5.6vh,40px);margin:4px 0 2px}.pitch{font-size:12px;line-height:1.4;margin-bottom:6px}.th{font-size:10.5px;padding:4px 8px 4px 11px}.ladder li{font-size:10.5px}#ovStats .val{font-size:17px}.btn.primary{padding:10px 30px;font-size:15px}.legend{margin-top:4px;line-height:1.8;font-size:10.5px}}
@media (max-height:640px){.threats,.ladder,.gifts{display:none}h1{font-size:30px}}
@media (max-height:480px){.pitch,.howto{display:none}}
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="Deck Guard: Deck the Halls playfield. Move your interceptor with the pointer, a finger, the arrow keys or a gamepad; its guns fire on their own"></canvas>
<div id="hud">
  <div class="chip" id="hullChip" title="Workshop hull"><span class="lbl">HULL</span><b id="hullV">10</b></div>
  <div class="chip" title="Interceptors left"><span class="lbl">JETS</span><b id="livesV">3</b></div>
  <div class="chip" title="Score"><span class="lbl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Pop 15 drones</span><span class="gp" id="goalP">0/15</span><i id="goalFill"></i></div>
  <button id="netBtn" type="button" aria-label="Fire the tinsel net (E or Space)" title="Tinsel net (E / Space)" disabled><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.2l1.9 4.1 4.5.5-3.4 3 1 4.4L8 11l-4 2.2 1-4.4-3.4-3 4.5-.5z" fill="currentColor"/></svg><b id="netV">0%</b><i id="netFill"></i></button>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P / Esc)">II</button>
  <button id="musicBtn" class="hbtn tog" type="button" aria-label="Music (N)" aria-pressed="true" title="Music (N)">&#9835;</button>
  <button id="muteBtn" class="hbtn tog" type="button" aria-label="Sound (M)" aria-pressed="true" title="Sound on/off (M)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q1.6 2.5 0 5M12.8 4q2.8 4 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
</div>
<button id="netTouch" type="button" hidden aria-label="Fire the tinsel net" disabled>NET<small id="netTouchV">0%</small></button>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="panel">
    <h1 id="ovTitle">DECK GUARD</h1>
    <div id="ovSub" class="sub">Deck the Halls</div>
    <p id="ovBody" class="pitch"></p>
    <div id="ovStats"></div>
    <div id="ovExtra"></div>
    <div class="row2"><button id="btnPrimary" class="btn primary" type="button">Scramble</button><button id="btnSecondary" class="btn" type="button" hidden>New run</button></div>
    <div class="legend">Drag, mouse or <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> fly &middot; guns fire on their own &middot; <kbd>E</kbd>/<kbd>Space</kbd> tinsel net &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> sound &middot; <kbd>N</kbd> music &middot; <kbd>R</kbd> restart &middot; gamepad: stick + A</div>
  </div>
</div>
<script>
'use strict';
(function () {
  // ---------------------------------------------------------------- basics
  const $ = (id) => document.getElementById(id);
  const W = 360, HUD_H = 46, RS = 3, CELL = 18, COLS = 20, TOP = 8;
  const cv = $('field'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function drawStar(c, x, y, R, r, rot) {
    c.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (rot || 0) + k * Math.PI / 5, d = k % 2 ? r : R; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
    c.closePath(); c.fill();
  }
  function distToSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }
  let vw = 360, vh = 640, dpr = 1, scale = 1, offX = 0, offY = HUD_H, T = 0;
  // Field geometry: the height follows the panel, a short wide Preview gets the compact field.
  const DECK_H = 86, ISL_X = 184;
  let H = 580, DECK_Y = 494, ROWS = 27, DIVE_ROW = 26, ZONE_TOP = 404;
  function layout(h) { H = h; DECK_Y = H - DECK_H; ROWS = Math.floor((DECK_Y - TOP) / CELL); DIVE_ROW = ROWS - 1; ZONE_TOP = DECK_Y - 5 * CELL; }
  const colX = (c) => c * CELL + CELL / 2;
  const rowY = (r) => TOP + r * CELL + CELL / 2;

  // ---------------------------------------------------------------- environment
  // The Preview sandbox blocks localStorage, so every read and write falls back to memory.
  const store = (() => {
    const mem = {}; let ls = null;
    try { ls = window.localStorage; ls.setItem('dgh.t', '1'); ls.removeItem('dgh.t'); } catch (e) { ls = null; }
    return {
      get(k, d) { try { const v = ls ? ls.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { const s = JSON.stringify(v); mem[k] = s; try { if (ls) ls.setItem(k, s); } catch (e) { /* memory only */ } },
    };
  })();
  let embedded = true;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  let reduceMotion = false;
  try {
    const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    reduceMotion = !!(mq && mq.matches);
    if (mq && mq.addEventListener) mq.addEventListener('change', (e) => { reduceMotion = !!e.matches; });
  } catch (e) { reduceMotion = false; }
  // Sound starts on in a browser tab and off inside the IDE Preview, unless the player chose otherwise.
  const prefs = (() => {
    const p = store.get('deckGuardHoliday.prefs', null) || {};
    return { muted: typeof p.muted === 'boolean' ? p.muted : embedded, music: typeof p.music === 'boolean' ? p.music : true };
  })();
  const savePrefs = () => store.set('deckGuardHoliday.prefs', { muted: prefs.muted, music: prefs.music });
  const best = (() => {
    const b = store.get('deckGuardHoliday.best', null) || {}, n = (v) => (typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : 0);
    return { score: n(b.score), wave: n(b.wave), runs: n(b.runs) };
  })();
  const saveBest = () => store.set('deckGuardHoliday.best', { score: best.score, wave: best.wave, runs: best.runs });

  // ---------------------------------------------------------------- sprites
  // Everything static is pre-rendered once at 3x and blitted; everything that moves is drawn live.
  function sprite(w, h, draw) { const c = mk(w * RS, h * RS), g = c.getContext('2d'); g.scale(RS, RS); draw(g); return c; }
  const LIVERY = {
    ornament:    { hi: '#ffb3bd', mid: '#e0243c', sh: '#5a0614', eye: '#ffe27a', glow: '255,80,100', band: '#ffd36b' },
    jingle:      { hi: '#fff2a8', mid: '#e3b02a', sh: '#5a3d06', eye: '#ff3b2e', glow: '255,214,90', band: '#c8102e' },
    frost:       { hi: '#ffffff', mid: '#9fdcff', sh: '#2c5f8a', eye: '#7ff6ff', glow: '150,220,255', band: '#ffffff' },
    gingerbread: { hi: '#f2b77a', mid: '#b0662c', sh: '#4a230c', eye: '#ffffff', glow: '240,160,90', band: '#ffffff' },
    coal:        { hi: '#6a6a74', mid: '#2a2a32', sh: '#0c0c10', eye: '#ff5a2a', glow: '255,110,40', band: '#ff7a2a' },
  };
  function horns(g, x, y, s) {
    g.strokeStyle = '#2a1a10'; g.lineWidth = 1.3 * s; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 2 * s, y); g.quadraticCurveTo(x - 5 * s, y - 1 * s, x - 5 * s, y - 4 * s); g.stroke();
    g.beginPath(); g.moveTo(x + 2 * s, y); g.quadraticCurveTo(x + 5 * s, y - 1 * s, x + 5 * s, y - 4 * s); g.stroke();
  }
  function droneSprite(kind, head, frame) {
    const p = LIVERY[kind];
    return sprite(20, 20, (g) => {
      const rotor = () => { g.fillStyle = 'rgba(230,240,255,.6)'; if (frame) g.fillRect(4, 0.4, 12, 1.1); else g.fillRect(9.4, -0.4, 1.2, 2.4); };
      if (kind === 'ornament') {
        rotor(); g.fillStyle = '#9a9aa2'; g.fillRect(9.4, 1.2, 1.2, 2);
        g.fillStyle = '#e8c55a'; rr(g, 7.4, 3, 5.2, 3, 0.8); g.fill();
        const gr = g.createRadialGradient(8, 9.4, 0.8, 10, 11.8, 8); gr.addColorStop(0, p.hi); gr.addColorStop(0.45, p.mid); gr.addColorStop(1, p.sh);

  // ---------------------------------------------------------------- presents
  function spawnGift(x, y) {
    const pool = [];

  }

      if (J.alive && (gf.x - J.x) ** 2 + (gf.y - J.y) ** 2 < 19 * 19) { gf.dead = true; collectGift(gf); continue; }
      if (gf.y > DECK_Y - 4) { gf.dead = true; burst(gf.x, gf.y, 8, ['#ffffff', GIFTS[gf.type].box], 60, 0, 1.6); addScore(25, gf.x, gf.y - 10, '200,210,230'); G.cheerT = Math.max(G.cheerT, 0.8); }
    }

  }
  function collectGift(gf) {
    const d = GIFTS[gf.type], long = U.magnet ? 1.35 : 1;

  // Jingle Shock: a ring of bells that pops every small drone close to the jet and dents anything big.

  // ---------------------------------------------------------------- the swarm
  // Each drone flies its lane cell by cell. At an edge or an ice block it drops one lane and turns, so a chain

    segs.splice(i, 1);
    const behind = segs[i];

      if (!wasHead) { S.splits++; text(x, y - 14, 'SPLIT!', '255,211,107', 12, 0.8); }
      const id = ++G.chainSeq, info = chains.get(s.chain) || { kind: s.kind, total: 1 };
      let n = 0; for (let k = i; k < segs.length && segs[k].chain === s.chain; k++) { segs[k].chain = id; n++; }
      chains.set(id, { kind: info.kind, total: n, announced: true, enraged: false });
      behind.head = true; behind.pop = 1; behind.alert = 0.9;
    }
    S.downed++; if (wasHead) S.heads++; if (byMg) S.mgKills++;
    S.combo = S.comboT > 0 ? S.combo + 1 : 1; S.comboT = 1.6; S.bestCombo = Math.max(S.bestCombo, S.combo);
    addScore(Math.round(((wasHead ? 100 : 10) + 5 * Math.min(20, S.combo - 1)) * comboMult()), x, y - 8, wasHead ? '255,150,90' : undefined);

  function stepSwarm(dt) {

  // ---------------------------------------------------------------- candy-cane missiles

  function launchMissile() {

  function pause() {
    if (G.mode !== 'play') return; G.mode = 'paused'; for (const k in keys) keys[k] = false;
    showOverlay({ title: 'PAUSED', sub: `Wave ${G.wave} · ${G.waveName}`, stats: true, extra: upgradesHtml() + ladderHtml(), primary: 'Resume', onPrimary: resume, secondary: 'New run', onSecondary: startRun });
  }
  function resume() { if (G.mode !== 'paused') return; audioStart(); G.mode = 'play'; hideOverlay(); }
  function gameOver() {
    G.mode = 'over'; sfx('over');
    const isNew = recordBest();
    showOverlay({ title: S.hull <= 0 ? 'WORKSHOP CRIPPLED' : 'OUT OF JETS', bad: true, sub: isNew ? 'New best score!' : `Fell at wave ${G.wave} · ${G.waveName}`, stats: true, isNew,
      body: S.done ? `You finished <b>${S.done} of ${MISSIONS.length}</b> missions and popped <b>${S.downed}</b> drones. Press <kbd>R</kbd> or <kbd>Enter</kbd> to fly again.` : 'Split the swarms high, before they reach the deck lanes, and save the tinsel net for a terminal dive.',
      extra: upgradesHtml() + ladderHtml(), primary: 'Scramble again', onPrimary: startRun });
  }
  function victory() {
    G.mode = 'won'; sfx('win'); flash(0.5, '255,240,220'); shake(6);
    const isNew = recordBest();
    for (let i = 0; i < 90; i++) part(rand(0, W), rand(-20, 60), rand(-60, 60), rand(40, 180), rand(1.6, 3), rand(2.5, 4.5), pick(['#ff4d5e', '#ffd36b', '#5fdc8f', '#ffffff', '#6fb6ff']), 0);
    showOverlay({ title: 'HALLS DECKED', sub: 'Krampus Prime is down', stats: true, isNew,
      body: `All <b>${MISSIONS.length}</b> missions done. The workshop held with <b>${S.hull}</b> hull and <b>${S.missiles}</b> candy canes crushed. Keep flying in endless waves, or start fresh.`,
      primary: 'Keep flying', onPrimary: () => { audioStart(); G.endless = true; G.mode = 'play'; hideOverlay(); }, secondary: 'New run', onSecondary: startRun });
  }

  // ---------------------------------------------------------------- input
  // Mouse: the jet follows the pointer. Touch: drag anywhere and the jet moves with your finger's motion
  // (relative, a little amplified), so your thumb never covers it; the NET button appears on first touch.
  function toField(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
  let drag = null, touchUsed = false;
  cv.addEventListener('pointerdown', (e) => {
    audioStart();
    if (e.pointerType === 'touch' && !touchUsed) { touchUsed = true; $('netTouch').hidden = false; }
    if (G.mode !== 'play' || !J) return;
    const p = toField(e);
    if (e.pointerType === 'touch' || e.pointerType === 'pen') { drag = { id: e.pointerId, fx: p.x, fy: p.y, jx: J.tx, jy: J.ty }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* optional */ } return; }
    J.tx = p.x; J.ty = p.y;
  });
  cv.addEventListener('pointermove', (e) => {
    if (G.mode !== 'play' || !J) return;
    const p = toField(e);
    if (e.pointerType === 'touch' || e.pointerType === 'pen') { if (!drag || drag.id !== e.pointerId) return; J.tx = drag.jx + (p.x - drag.fx) * 1.3; J.ty = drag.jy + (p.y - drag.fy) * 1.3; return; }
    J.tx = p.x; J.ty = p.y;
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  $('btnPrimary').addEventListener('click', () => { if (primaryAct) primaryAct(); });
  $('btnSecondary').addEventListener('click', () => { if (secondaryAct) secondaryAct(); });
  $('pauseBtn').addEventListener('click', () => { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); });
  $('musicBtn').addEventListener('click', () => { audioStart(); setMusic(!prefs.music); });
  $('muteBtn').addEventListener('click', () => { audioStart(); setMute(!prefs.muted); });
  $('netBtn').addEventListener('click', () => fireNet());
  $('netTouch').addEventListener('pointerdown', (e) => { if (e && e.preventDefault) e.preventDefault(); audioStart(); fireNet(); });
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
  const PICKKEY = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
  window.addEventListener('keydown', (e) => {
    const c = e.code;
    audioStart();
    if (G.mode === 'pick') {
      if (PICKKEY[c] !== undefined) { e.preventDefault(); takePick(PICKKEY[c]); return; }
      if (c === 'ArrowLeft' || c === 'KeyA' || c === 'ArrowUp' || c === 'KeyW') { e.preventDefault(); sel = (sel + offer.length - 1) % offer.length; markSel(); return; }
      if (c === 'ArrowRight' || c === 'KeyD' || c === 'ArrowDown' || c === 'KeyS') { e.preventDefault(); sel = (sel + 1) % offer.length; markSel(); return; }
    }
    if (KEYMAP[c]) { keys[KEYMAP[c]] = true; e.preventDefault(); return; }
    if (c === 'Enter' || c === 'NumpadEnter' || (c === 'Space' && G.mode !== 'play')) { e.preventDefault(); if (G.mode !== 'play' && G.mode !== 'dying' && primaryAct) primaryAct(); return; }
    if (c === 'KeyE' || c === 'Space') { e.preventDefault(); fireNet(); }
    else if (c === 'KeyP' || c === 'Escape') { if (G.mode === 'play') pause(); else if (G.mode === 'paused') resume(); }
    else if (c === 'KeyM') setMute(!prefs.muted);
    else if (c === 'KeyN') setMusic(!prefs.music);
    else if (c === 'KeyR') { if (G.mode === 'paused' || G.mode === 'over' || G.mode === 'won') startRun(); }
  });
  window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
  window.addEventListener('resize', resize);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.mode === 'play') pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { for (const k in keys) keys[k] = false; if (G.mode === 'play') pause(); } });
  // Gamepad: stick or d-pad flies, A / RB / RT fires the net, Start pauses; on panels A confirms, B or X is
  // the second button, and the d-pad picks a workshop gift.
  function pollPad() {
    let gp = null;
    try { const list = navigator.getGamepads ? navigator.getGamepads() : null; if (list) for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) { gp = list[i]; break; } } catch (e) { gp = null; }
    pad.x = 0; pad.y = 0;
    if (!gp) { pad.prev = []; return; }
    const btn = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed), dz = (v) => (Math.abs(v) < 0.18 ? 0 : v);
    const nowB = []; for (let i = 0; i < 16; i++) nowB[i] = btn(i);
    const hit = (i) => nowB[i] && !pad.prev[i];
    if (nowB.some((b, i) => b && !pad.prev[i])) audioStart();
    if (G.mode === 'play') {
      pad.x = dz(gp.axes[0] || 0) + (nowB[15] ? 1 : 0) - (nowB[14] ? 1 : 0); pad.y = dz(gp.axes[1] || 0) + (nowB[13] ? 1 : 0) - (nowB[12] ? 1 : 0);
      if (hit(0) || hit(5) || hit(7)) fireNet();
      if (hit(9)) pause();
    } else if (G.mode === 'pick') {
      if (hit(14) || hit(12)) { sel = (sel + offer.length - 1) % offer.length; markSel(); }
      if (hit(15) || hit(13)) { sel = (sel + 1) % offer.length; markSel(); }
      if (hit(0)) takePick(sel);
    } else if (G.mode === 'paused' && hit(9)) resume();
    else if (hit(0) || hit(9)) { if (G.mode !== 'dying' && primaryAct) primaryAct(); }
    else if ((hit(1) || hit(2)) && secondaryAct) secondaryAct();
    pad.prev = nowB;
  }

  // ---------------------------------------------------------------- loop
  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const raw = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 1 / 60;
    last = ts;
    pollPad();
    let dt = raw;
    if (G.hitStop > 0) { G.hitStop -= raw; dt = raw * 0.25; }
    update(dt); stepSnow(raw); updateHud(false); render();
    audioTick(); audioLoops();
  }
  // Playtest handle (the arcade convention, see __deckGuard). Nothing in the game reads it.
  window.__deckGuardHoliday = {
    state: () => ({ mode: G.mode, phase: G.mode, wave: G.wave, waveName: G.waveName, score: S && S.score, best: best.score, hull: S && S.hull, lives: S && S.lives, mission: S && S.mi + 1, done: S && S.done,
      downed: S && S.downed, missiles: S && S.missiles, gifts: S && S.gifts, combo: S && S.combo, bestCombo: S && S.bestCombo, time: S && Math.round(S.time), segs: segs.length, divers: divers.length,
      inbound: missiles.length, sleighs: sleighs.length, bombs: bombs.length, presents: gifts.length, wrecks: wrecks.size, net: S && S.net, upgrades: U ? Object.assign({}, U) : null,
      boss: boss ? { phase: boss.phase, bells: podsAlive(), core: boss.core, dying: boss.dying > 0 } : null, muted: prefs.muted, music: prefs.music, autoplay: G.bot, audio: !!A.ctx }),
    autopilot: (on) => { G.bot = !!on; },
    autoplay: (on) => { G.bot = !!on; },
    start: () => startRun(),
    pick: (i) => takePick(i | 0),
    invulnerable: (on) => { G.godTest = !!on; },
    clearWave: () => { if (boss && boss.dying <= 0) { for (const p of boss.pods) p.alive = false; boss.phase = 2; boss.core = 1; hitBoss(boss.x, boss.y, 5); } for (const s of segs.slice()) killSeg(s, false); divers = []; for (const b of sleighs) hurtSleigh(b, 999); G.sleighsLeft = 0; },
    spawnSleigh: () => spawnSleigh(sleighs.length),
    spawnBoss: () => { if (!boss) { G.bossSpawned = true; spawnBoss(); } },
    boss: () => (boss ? { phase: boss.phase, bells: podsAlive(), core: boss.core, dying: boss.dying > 0, whip: !!boss.whip } : null),
    launchMissile: () => launchMissile(),
    dropGift: (type) => { if (!S || !J) return; const before = gifts.length; spawnGift(J.x, J.y - 60); if (type && GIFTS[type] && gifts.length > before) gifts[gifts.length - 1].type = type; },
  };
  syncSoundButtons();
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
