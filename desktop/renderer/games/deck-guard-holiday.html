<!-- Deck Guard: Deck the Halls. The holiday edition of Deck Guard: Krampus has hijacked the gift drones, and their swarms snake down on Santa's flight-deck workshop on a frozen night sea. Fly the candy interceptor, split the swarms, shoot candy-cane missiles out of their glide, unwrap presents, pick a workshop gift after every wave and face a boss every fourth wave: the Nutcracker King, Krampus Prime and the Frost Queen. Every run earns Candy for the Workshop (permanent upgrades, three interceptors, jet trails); three rotating missions raise your Elf Rank; the Daily Siege lays out the same skies for everyone; combos fill Christmas Spirit for a Yuletide Overdrive; parachuting elves repair the deck. Music is a synthesized arrangement of the public-domain carol Deck the Halls that grows with the fight. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DECK GUARD: DECK THE HALLS</title>
<style>
:root{--bg:#040814;--ink:#f2f6ff;--dim:#9aa6c4;--gold:#ffd36b;--ice:#bfe9ff;--red:#ff4d5e;--green:#5fdc8f;--panel:rgba(8,12,28,.93)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.hidden,[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 8px;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 10px;border-radius:10px;background:rgba(8,14,30,.66);border:1px solid rgba(191,233,255,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.chip .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.2em}
#hullV{color:var(--green)}
#hullChip.low #hullV{color:var(--red)}
#hullChip.low{border-color:rgba(255,77,94,.7);animation:lowpulse .8s ease-in-out infinite alternate}
@keyframes lowpulse{from{box-shadow:0 0 0 rgba(255,77,94,0)}to{box-shadow:0 0 14px rgba(255,77,94,.7)}}
#livesV{color:var(--ice)}
.chip.goal{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;border-color:rgba(255,211,107,.42)}
.chip.goal .gn{flex:none;color:var(--gold);font-size:10px;letter-spacing:.14em}
.chip.goal .gt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;letter-spacing:.04em;font-weight:700}
.chip.goal .gp{flex:none;color:var(--ice);font-variant-numeric:tabular-nums;font-size:11px}
.chip.goal i{position:absolute;left:0;bottom:0;height:3px;width:0;background:repeating-linear-gradient(135deg,#ff4d5e 0 6px,#fff 6px 12px);box-shadow:0 0 8px rgba(255,211,107,.8);transition:width .3s ease}
.chip.goal.flash{animation:gflash .7s ease}
@keyframes gflash{0%{box-shadow:0 0 30px rgba(255,211,107,.95);border-color:var(--gold)}100%{box-shadow:none}}
.chip.bump{animation:bump .38s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbtn{flex:none;pointer-events:auto;cursor:pointer;width:31px;height:31px;border-radius:10px;color:var(--ink);background:rgba(8,14,30,.72);border:1px solid rgba(191,233,255,.35);font:800 12px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--gold);box-shadow:0 0 12px rgba(255,211,107,.45);outline:none}
.hbtn svg{display:block;margin:auto}
.hbtn.tog[aria-pressed="false"]{color:var(--dim);background:linear-gradient(135deg,transparent 46%,rgba(255,77,94,.75) 47%,rgba(255,77,94,.75) 53%,transparent 54%),rgba(8,14,30,.72)}
#netBtn{flex:none;position:relative;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;height:31px;padding:0 8px;border-radius:10px;color:var(--gold);font:900 11px/1 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:rgba(8,14,30,.74);border:1px solid rgba(255,211,107,.4);overflow:hidden}
#netBtn i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#netBtn.ready{border-color:var(--gold);animation:ready 1s ease-in-out infinite alternate}
#netBtn:disabled{cursor:default;color:var(--dim)}
#netBtn b{min-width:30px;text-align:right}
@keyframes ready{from{box-shadow:0 0 8px rgba(255,211,107,.35)}to{box-shadow:0 0 22px rgba(255,211,107,.9)}}
#netTouch{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:6;width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,211,107,.75);background:radial-gradient(circle at 40% 35%,rgba(255,211,107,.32),rgba(120,16,32,.6));color:#fff;font:900 14px/1.05 ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.1em;touch-action:none;opacity:.88}
#netTouch small{display:block;font-size:10px;letter-spacing:.04em;opacity:.85;margin-top:2px}
#netTouch.ready{opacity:1;animation:ready 1s ease-in-out infinite alternate}
#netTouch:disabled{opacity:.42}
@media (max-width:460px){#hud{gap:4px;padding:7px 5px}.chip .lbl{display:none}.chip{padding:0 7px}.chip.goal .gn{display:none}.hbtn{width:27px}#netBtn{padding:0 6px}#netBtn b{display:none}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,5,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{position:relative;background:var(--panel);border:1px solid rgba(255,211,107,.34);border-radius:18px;padding:18px 18px 14px;width:min(560px,96vw);max-height:96vh;overflow-y:auto;text-align:center;box-shadow:0 0 44px rgba(255,211,107,.12),inset 0 0 60px rgba(20,30,70,.6)}
.panel::before{content:"";position:absolute;left:14px;right:14px;top:0;height:5px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(135deg,#ff4d5e 0 9px,#fff 9px 18px)}
h1{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.14em;line-height:1.05;margin:6px 0 2px;background:linear-gradient(90deg,#ff6a78 0%,#fff3f3 38%,#8ff0b0 66%,#ffd36b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,211,107,.35))}
h1.bad{background:linear-gradient(90deg,#ff4d5e,#ffb35a);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--gold);letter-spacing:.42em;font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pitch{font-size:13px;line-height:1.5;color:#cdd7ef;max-width:56ch;margin:0 auto 8px}
.pitch b{color:var(--gold)}
.bestline{display:inline-block;margin-top:6px;color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:11px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.howto div{position:relative;padding:8px 6px 7px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;line-height:1.35;color:#cdd7ef}
.howto i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:900;font-size:10.5px;margin-right:4px}
.howto b{display:inline-block;color:var(--gold);letter-spacing:.16em;font-size:11px;margin-bottom:3px}
.howto span{display:block}
.threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:5px;margin:2px 0 8px;text-align:left}
.th{position:relative;font-size:11.5px;line-height:1.35;color:#cdd7ef;padding:6px 9px 6px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.th::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.th b{display:block;font-size:10.5px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.gifts{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:2px 0 6px}
.gifts span{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.05);border-left:4px solid var(--c);color:#dfe6f7}
.legend{font-size:11px;color:var(--dim);margin-top:8px;line-height:2}
kbd{display:inline-block;min-width:22px;padding:2px 6px;margin:0 2px;border-radius:6px;font-weight:800;font-family:inherit;font-size:10.5px;color:var(--gold);background:rgba(255,211,107,.08);border:1px solid rgba(255,211,107,.45)}
.row2{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px;padding:11px 20px;border-radius:12px;font-family:inherit;background:linear-gradient(180deg,rgba(191,233,255,.14),rgba(191,233,255,.03));border:1px solid rgba(191,233,255,.5)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 22px rgba(255,211,107,.5);outline:none}
.btn.primary{font-size:16px;padding:13px 34px;background:linear-gradient(180deg,rgba(255,77,94,.4),rgba(120,16,32,.25));border-color:rgba(255,211,107,.8);box-shadow:0 0 18px rgba(255,77,94,.3)}
#ovStats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#ovStats:empty{display:none}
#ovStats div{display:flex;flex-direction:column;gap:2px;min-width:58px}
#ovStats .lbl{font-size:9.5px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
#ovStats .val{font-size:21px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#ovStats .val.new{color:var(--green)}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 10px;margin:6px 0 2px;text-align:left}
.ladder li{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder li.ok{color:#b8f5c8}
.ladder li span{display:inline-block;width:16px;font-weight:900}
.upg{font-size:11px;color:#cdd7ef;margin:6px 0 0;letter-spacing:.04em}
.upg b{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.card{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 7px 10px;border-radius:12px;color:var(--ink);font-family:inherit;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);text-align:center}
.card svg{width:42px;height:42px;flex:none}
.card div{display:flex;flex-direction:column;gap:3px}
.card b{font-size:11.5px;letter-spacing:.08em;color:var(--gold)}
.card span{font-size:11px;line-height:1.3;color:#cdd7ef}
.card em{font-style:normal;font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.card.sel,.card:hover,.card:focus-visible{border-color:var(--gold);box-shadow:0 0 20px rgba(255,211,107,.45);outline:none;background:rgba(255,211,107,.09)}
@media (max-width:440px){.cards{grid-template-columns:1fr;gap:6px}.card{flex-direction:row;text-align:left;padding:9px 10px}.card svg{width:34px;height:34px}.howto{grid-template-columns:1fr}}
@media (max-height:820px){.panel{padding:12px 16px 10px}h1{font-size:clamp(24px,5.6vh,40px);margin:4px 0 2px}.pitch{font-size:12px;line-height:1.4;margin-bottom:6px}.th{font-size:10.5px;padding:4px 8px 4px 11px}.ladder li{font-size:10.5px}#ovStats .val{font-size:17px}.btn.primary{padding:10px 30px;font-size:15px}.legend{margin-top:4px;line-height:1.8;font-size:10.5px}}
@media (max-height:640px){.threats,.ladder,.gifts{display:none}h1{font-size:30px}}
@media (max-height:480px){.pitch,.howto{display:none}}
#fxTop{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:12}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.btn.nb{padding:9px 6px;font-size:11px;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.nb small{font-size:9.5px;letter-spacing:.05em;color:var(--gold);text-transform:none;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb.hot{border-color:var(--gold);animation:ready 1s ease-in-out infinite alternate}
.mbox{margin:6px 0 2px;text-align:left;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,211,107,.22)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;font-weight:900;margin-bottom:3px}
.mhead b{color:var(--gold)}
.mhead span{color:var(--dim);letter-spacing:.06em;font-weight:700;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px;color:#dfe6f7}
.mrow .mi{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,77,94,.85);color:#fff;font-weight:900;font-size:10px}
.mrow.ok{animation:okpop .7s ease}
.mrow.ok .mi{background:var(--green);color:#06210f}
.mrow.ok .mt span{color:#b8f5c8}
.mrow .mt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.mrow .mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mp{flex:none;font-variant-numeric:tabular-nums;color:var(--ice);font-size:10.5px;font-weight:800}
.mrow .mr{flex:none;color:var(--gold);font-size:10.5px;font-weight:900}
.mrow.note{font-size:10.5px;color:var(--dim)}
@keyframes okpop{0%{transform:scale(1.05);background:rgba(95,220,143,.28)}100%{transform:none;background:transparent}}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,#ff4d5e,#ffd36b);transition:width .5s ease}
.bar.g i{background:linear-gradient(90deg,#5fdc8f,#bfe9ff)}
.rankline{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:10.5px;color:#cdd7ef;letter-spacing:.05em;text-align:left}
.rankline b{color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.rankline .bar{flex:1 1 60px;min-width:40px}
.rankline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.candyBox{margin:6px auto 4px;padding:8px 12px;border-radius:14px;background:radial-gradient(circle at 50% 0,rgba(255,211,107,.2),rgba(255,255,255,.03));border:1px solid rgba(255,211,107,.5);max-width:360px}
.candyBox .lbl{display:block;font-size:9.5px;letter-spacing:.24em;color:var(--dim)}
.candyBox .big{display:block;font-size:34px;line-height:1.1;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,211,107,.55)}
.candyBox small{display:block;font-size:10.5px;color:#cdd7ef;letter-spacing:.03em;margin-top:2px}
.candyBox small b{color:var(--gold);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0}
.chips span{font-size:10px;font-weight:900;letter-spacing:.12em;padding:4px 8px;border-radius:8px;background:rgba(95,220,143,.16);border:1px solid rgba(95,220,143,.6);color:#b8f5c8;animation:okpop .8s ease}
.chips span.gold{background:rgba(255,211,107,.14);border-color:rgba(255,211,107,.7);color:var(--gold)}
.shop h3{font-size:10px;letter-spacing:.24em;color:var(--gold);margin:10px 0 5px;text-align:left}
.wallet{display:flex;justify-content:center;align-items:baseline;gap:8px;font-weight:900;color:var(--gold);font-size:24px;font-variant-numeric:tabular-nums}
.wallet span{font-size:10px;letter-spacing:.24em;color:var(--dim)}
.ships{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scard{cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:8px 7px;border-radius:12px;color:var(--ink);font-family:inherit;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
.scard canvas{width:44px;height:44px;align-self:center}
.scard b{font-size:10.5px;letter-spacing:.08em;color:var(--c,#ffd36b)}
.scard span{font-size:10px;line-height:1.3;color:#cdd7ef}
.scard em{font-style:normal;font-size:9.5px;letter-spacing:.12em;color:var(--gold);font-weight:900}
.scard.on{border-color:var(--gold);box-shadow:0 0 16px rgba(255,211,107,.35);background:rgba(255,211,107,.08)}
.scard.locked{opacity:.8}
.scard:hover,.scard:focus-visible,.buy:hover,.buy:focus-visible{border-color:var(--gold);outline:none}
.urow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.06);text-align:left}
.urow svg{width:28px;height:28px;display:block}
.urow b{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--gold)}
.urow span{display:block;font-size:10.5px;color:#cdd7ef;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.14)}
.pips i.on{background:linear-gradient(90deg,#ffd36b,#ff8a4a);box-shadow:0 0 6px rgba(255,211,107,.6)}
.buy{cursor:pointer;min-width:78px;padding:7px 8px;border-radius:10px;font-family:inherit;font-weight:900;font-size:10.5px;letter-spacing:.08em;color:var(--ink);background:rgba(255,211,107,.1);border:1px solid rgba(255,211,107,.55);display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.buy:disabled{cursor:default;opacity:.55;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.buy.can{box-shadow:0 0 12px rgba(255,211,107,.5);background:rgba(255,211,107,.18)}
.trails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.trails .buy{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;gap:6px}
.trails .buy i.sw{flex:none;width:30px;height:6px;border-radius:3px}
.trails .buy.on{border-color:var(--gold);box-shadow:0 0 12px rgba(255,211,107,.45)}
@media (max-width:440px){.ships{grid-template-columns:1fr}.scard{flex-direction:row;align-items:center;flex-wrap:wrap}.scard canvas{width:34px;height:34px}.trails{grid-template-columns:1fr}.btn.nb{letter-spacing:.06em;font-size:10px}}
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="Deck Guard: Deck the Halls playfield. Move your interceptor with the pointer, a finger, the arrow keys or a gamepad; its guns fire on their own"></canvas>
<div id="hud">
  <div class="chip" id="hullChip" title="Workshop hull"><span class="lbl">HULL</span><b id="hullV">10</b></div>
  <div class="chip" title="Interceptors left"><span class="lbl">JETS</span><b id="livesV">3</b></div>
  <div class="chip" title="Score"><span class="lbl">SCORE</span><b id="scoreV">0</b></div>
  <div class="chip goal" id="goalChip" title="Current mission"><span class="gn" id="goalN">GOAL 1/13</span><span class="gt" id="goalT">Pop 15 drones</span><span class="gp" id="goalP">0/15</span><i id="goalFill"></i></div>
  <button id="netBtn" type="button" aria-label="Fire the tinsel net (E or Space)" title="Tinsel net (E / Space)" disabled><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.2l1.9 4.1 4.5.5-3.4 3 1 4.4L8 11l-4 2.2 1-4.4-3.4-3 4.5-.5z" fill="currentColor"/></svg><b id="netV">0%</b><i id="netFill"></i></button>
  <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause (P)" title="Pause (P / Esc)">II</button>
  <button id="musicBtn" class="hbtn tog" type="button" aria-label="Music (N)" aria-pressed="true" title="Music (N)">&#9835;</button>
  <button id="muteBtn" class="hbtn tog" type="button" aria-label="Sound (M)" aria-pressed="true" title="Sound on/off (M)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q1.6 2.5 0 5M12.8 4q2.8 4 0 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
</div>
<button id="netTouch" type="button" hidden aria-label="Fire the tinsel net" disabled>NET<small id="netTouchV">0%</small></button>

  // ---------------------------------------------------------------- the swarm
  // Each drone flies its lane cell by cell. At an edge or an ice block it drops one lane and turns, so a chain
  // snakes down the screen. Shooting a drone leaves an ice block and splits the chain: the one behind leads.
  // Take segs[i] out of its chain. The drones behind it become a new chain with its own leader; true if split.
  function detachSeg(i) {

  function killSeg(s, byMg) {

  // The swarm surge (wave 7+) speeds every chain up the longer a wave drags on; a Ginger Stampede adds 25%.

    pick: (i) => takePick(i | 0),
    invulnerable: (on) => { G.godTest = !!on; },
    clearWave: () => { killBoss(); for (const s of segs.slice()) killSeg(s, false); divers = []; ebullets = []; for (const b of sleighs) hurtSleigh(b, 999); G.sleighsLeft = 0; },
    spawnSleigh: () => spawnSleigh(sleighs.length),
    // spawnBoss() keeps the old behaviour (the current wave's boss, or Krampus Prime off a boss wave); spawnBoss('king' | 'krampus' | 'queen') picks one
    spawnBoss: (type) => { if (!boss) { G.bossSpawned = true; spawnBoss(type); } },
    boss: () => (boss ? { type: boss.type, phase: boss.phase, bells: podsAlive(), core: boss.core, dying: boss.dying > 0, whip: !!boss.whip, beam: !!boss.beam, volley: !!boss.volley } : null),
    launchMissile: () => launchMissile(),
    dropGift: (type) => { if (!S || !J) return; const before = gifts.length; spawnGift(J.x, J.y - 60); if (type && GIFTS[type] && gifts.length > before) gifts[gifts.length - 1].type = type; },
    // debug helpers for the meta layer and the new mechanics
    grantCandy: (n) => { const v = Math.max(0, Math.floor(Number(n) || 0)); meta.candy += v; meta.earned += v; saveMeta(); if (view === 'title' || view === 'over') syncNav(); return meta.candy; },
    completeMission: (i) => completeMission(clamp(i | 0, 0, 2)),
    buy: (key) => { const k = String(key || ''); if (k.startsWith('ship:')) return buyShip(k.slice(5)); if (k.startsWith('trail:')) return buyTrail(k.slice(6)); return buyUpgrade(k); },
    equip: (ship) => (SHIP_KEYS.includes(ship) && meta.ships[ship] ? buyShip(ship) : false),
    unlockAll: () => { for (const k of SHIP_KEYS) meta.ships[k] = true; for (const k of TRAIL_KEYS) meta.trails[k] = true; for (const k of UPG_KEYS) meta.up[k] = UPG_MAX; saveMeta(); },
    resetMeta: () => { Object.assign(meta, parseMeta({})); initMissions(); saveMeta(); },
    setSeed: (s) => { G.seedOverride = s == null ? '' : String(s); return runSeed(); },
    daily: () => startRun(true),
    setWave: (n) => {
      if (!S) return; const w = Math.max(1, n | 0);
      segs = []; divers = []; missiles = []; bombs = []; ebullets = []; imps = []; sleighs = []; boss = null; chains.clear();
      G.pendingWave = false; G.waveT = 0; G.wave = w; loadWave(w);
    },
    overdrive: () => { if (S && S.odT <= 0) startOverdrive(); },
    spawnElf: () => spawnChute(J ? J.x : W / 2, ZONE_TOP - 60),
    hunter: () => launchHunter(),
    shop: () => { if (G.mode === 'title' || G.mode === 'over') openShop(backFn()); },
    missionsPanel: () => { if (G.mode === 'title' || G.mode === 'over') openMissions(backFn()); },
    dprCap: (v) => { if (typeof v === 'number' && v >= 1) { dprCap = Math.min(3, v); resize(); } return dpr; },
  };
  syncSoundButtons();
  initMissions();
  resize();
  titleScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
