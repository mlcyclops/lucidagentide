# lucid-holder (P-HOLDER.1, ADR-0528): owns one lane's agent process so the engine can go away and come back.

[package]
name = "lucid-holder"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[dependencies]
interprocess = "2"
parking_lot = "0.12"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
