#
# lucid-relay (ADR-0540): the remote-spokes relay in Rust. Phase A is a drop-in for the add-on's Bun relay
# (`lucid-spoke relay serve`): the same flags, environment, routes, answers, limits, log lines and state folder.
# Phase B (`lucid-relay collab`) is the core's collab broker (tools/relay/serve.ts), wire-compatible with desktop/collab.
# Phase C (`lucid-relay meet`) is the Meeting Hub rendezvous relay (relay/meet_relay.py): same relay.json and state.json.

[package]
name = "lucid-relay"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[features]
default = []
# The AWS-LC FIPS module for every primitive the relay uses: TLS (listener and outbound client), ECDSA P-256 and
# Ed25519 verification, SHA-256, the gate's RS256 check and the random bytes (needs CMake and Go at build time, see
# aws-lc-rs). A fips build refuses to start unless AWS-LC reports FIPS mode.
fips = ["rustls/fips", "aws-lc-rs/fips"]
# AC-1 2.4 "Development licenses" (R4-H1): accept licenses signed by a development key (LUCID_LICENSE_DEV=1 and
# LUCID_LICENSE_DEV_PUB, read only in this build), logging "This build accepts development licenses. Not for
# production." at every start. Never enabled by release CI; with the release profile or `fips` it does not compile.
dev-license = []
# AC-1 2.4 "No test clock in a deployable build" (R3-M10, R4-H1): only for the unsigned, never-shipped live check
# binary `lucid-relay-seatclock-check` (an accelerated seat day; development-key licenses only, no publisher key; its
# own state folder only). With the release profile or `fips` it does not compile (src/meet_time.rs).
live-check-clock = []

[[bin]]
name = "lucid-relay"
path = "src/main.rs"

[[bin]]
name = "lucid-relay-seatclock-check"
path = "src/bin/lucid-relay-seatclock-check.rs"
required-features = ["live-check-clock"]
# the modules' tests run once, in the lucid-relay binary
test = false

[dependencies]
aws-lc-rs = "1"
bytes = "1"
# Scheduled meetings (Meet relay): recurring meetings repeat at the same wall-clock time in the organizer's IANA zone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "0.5"
http-body-util = "0.1"
# http2: the Meet relay's APNs sender (contract PB-1 section 5; Apple takes HTTP/2 only). hyper's own feature, through
# the `h2` crate: framing only, TLS and every primitive stay on rustls and AWS-LC.
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-roots", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
indexmap = "2"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# AC-1 3.3: console passwords are counted in code points after NFKC (Unicode tables only, no crypto).
unicode-normalization = "0.1"
webpki-roots = "1"

[dev-dependencies]
# Tests sign certificates, tokens and passkey answers with fixed P-256 keys; the relay itself only verifies, on AWS-LC.
p256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
