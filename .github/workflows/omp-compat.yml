# omp compatibility probe (POAM R-01 — derisk bumping oh-my-pi).
#
# omp ships ~3 releases/day and has broken behavior within minor versions, so we EXACT-PIN it and
# never bump blindly (see the add-on repo BD/omp-license-and-version-pin.md). This workflow bumps omp
# to the latest (or a chosen version) ON A BRANCH and runs the full suite plus the two correctness
# keystones — the FAIL-CLOSED gate test and the BYTE-STABLE prompt-prefix check. If everything is
# green it opens a ready-to-merge bump PR; if anything breaks it files a tracking issue. It NEVER
# touches master automatically — a human reviews the omp seam changes and merges.

name: omp compatibility probe

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC (omp moves fast; bump the cadence if you want)
  workflow_dispatch:
    inputs:
      version:
        description: "omp version/tag to test (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: omp-compat
  cancel-in-progress: true

jobs:
  probe:
    name: Bump omp + run keystone checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The fail-closed gate test spawns the zero-dependency scanner sidecar as `python server.py`,
      # so the runner needs `python` on PATH.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve current pin vs target omp version
        id: ver
        env:
          TARGET: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          CUR=$(node .github/scripts/omp-compat.mjs current)
          MAJOR="${CUR%%.*}"
          LATEST=$(node .github/scripts/omp-compat.mjs version "$(npm view "@oh-my-pi/pi-coding-agent@latest" version)")
          # Newest release WITHIN the current major. This is the bump we could actually take, and until
          # now the probe never looked at it: it only ever tested `latest`. Once `latest` moved to a
          # major that breaks us, the probe went permanently red and stopped reporting anything, which
          # is how 16.5.2 sat available and compatible for five weeks while every run failed on 18.x.
          #
          # Resolved from the full versions LIST, not `npm view pkg@^16 version`: that range form prints
          # one line PER matching version, so a tail/sed parse of it produced the doubled string
          # "16.5.216.5.2" when tested against the real registry. Prereleases are excluded and the sort
          # is numeric per component, so "16.10.0" cannot lose to "16.9.0" the way a lexical sort would.
          SAME=$(npm view "@oh-my-pi/pi-coding-agent" versions --json 2>/dev/null | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=process.argv[1];
              const v=JSON.parse(s).filter(x=>x.startsWith(m+'.')&&!x.includes('-'));
              v.sort((a,b)=>{const A=a.split('.').map(Number),B=b.split('.').map(Number);return (A[0]-B[0])||(A[1]-B[1])||(A[2]-B[2])});
              console.log(v.pop()||'');
            })" "$MAJOR")
          [ -n "$SAME" ] || SAME="$CUR"
          # Manual dispatch wins. Otherwise prefer the same-major bump; only when we are already at the
          # top of our own major do we probe the next major, which is the genuinely risky question.
          if [ -n "$TARGET" ] && [ "$TARGET" != "latest" ]; then
            RESOLVED=$(node .github/scripts/omp-compat.mjs version "$(npm view "@oh-my-pi/pi-coding-agent@${TARGET}" version)")
          elif [ "$SAME" != "$CUR" ]; then
            RESOLVED="$SAME"
          else
            RESOLVED="$LATEST"
          fi
          # A candidate that crosses the major is EXPECTED to be able to fail. That distinction decides
          # whether a failure is news (file an issue, stay green) or an alarm (fail the job).
          if [ "${RESOLVED%%.*}" = "$MAJOR" ]; then JUMP=false; else JUMP=true; fi
          echo "current=$CUR"       >> "$GITHUB_OUTPUT"
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "same_major=$SAME"   >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"     >> "$GITHUB_OUTPUT"
          echo "major_jump=$JUMP"   >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$RESOLVED" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## omp compatibility probe"
            echo "- Current pin: \`$CUR\`"
            echo "- Newest in ${MAJOR}.x: \`$SAME\`"
            echo "- Newest overall: \`$LATEST\`"
            echo "- Testing: \`$RESOLVED\` ($([ "$JUMP" = true ] && echo "MAJOR JUMP, failure is expected news" || echo "same major, failure is an alarm"))"
            [ "$CUR" = "$RESOLVED" ] && echo "- **Already pinning the target: nothing to test.**" || echo "- Testing the bump..."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare isolated exact-pin candidate and regression
        id: candidate
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.resolved }}"
          git checkout -b "chore/omp-bump-$V"
          bun add --exact "@oh-my-pi/pi-agent-core@$V" "@oh-my-pi/pi-ai@$V" "@oh-my-pi/pi-catalog@$V" "@oh-my-pi/pi-coding-agent@$V" "@oh-my-pi/pi-tui@$V" "@oh-my-pi/pi-utils@$V"
          node .github/scripts/omp-compat.mjs migrate "${{ steps.ver.outputs.current }}" "$V"

      - name: Typecheck (root)
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: bun x tsc --noEmit

      - name: Full harness test suite
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: bun test harness

      - name: "KEYSTONE 1 — fail-closed gate (sidecar dies → gate BLOCKS)"
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: bun test harness/security/gate.failclosed.test.ts

      - name: "KEYSTONE 2 — byte-stable frozen prompt prefix (KV-cache)"
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: bun run harness/scripts/demo02_prefix_hash.ts

      - name: Desktop install
        id: desktop_install
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: desktop
        run: bun install

      - name: Desktop typecheck
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        working-directory: desktop
        run: bun x tsc --noEmit

      - name: Desktop tests
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        working-directory: desktop
        run: bun test .

      - name: Scanner sidecar (Python)
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: scanner-sidecar
        run: |
          python -m pip install -q pytest
          python -m pytest -q

      - name: Record compatibility success before publication
        id: compatible
        if: success() && steps.ver.outputs.skip == 'false'
        run: echo "All candidate compatibility gates passed" >> "$GITHUB_STEP_SUMMARY"

      # GREEN: open (or refresh) a ready-to-merge bump PR. master is untouched.
      - name: Open ready-to-merge bump PR (all checks green)
        id: publish
        if: success() && steps.compatible.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.resolved }}"
          BR="chore/omp-bump-$V"
          git config user.name "omp-compat-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock harness/prompt/prefix_compaction.test.ts
          git commit -m "chore(deps): bump omp to $V (compat probe green)"
          git push -f origin "$BR"
          BODY="Automated omp compatibility probe. omp \`${{ steps.ver.outputs.current }}\` → \`$V\`.

          **All keystone checks passed** against \`$V\`:
          - typecheck (root + desktop)
          - full harness suite + desktop suite
          - KEYSTONE 1: fail-closed gate (sidecar killed mid-call → gate blocks)
          - KEYSTONE 2: byte-stable frozen prompt prefix
          - scanner sidecar pytest
          - exact-pin regression assertion and version-appropriate portable compaction configuration

          Before merging, skim the omp release notes for seam changes (compaction/context, eval, thinking, providers). Then merge to move the exact pin forward. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXIST=$(gh pr list --base master --head "$BR" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh pr edit "$EXIST" --body "$BODY"
          else
            gh pr create --base master --head "$BR" \
              --title "chore(deps): bump omp ${{ steps.ver.outputs.current }} to $V (compat probe green)" \
              --body "$BODY" \
              --label "dependencies"
          fi
          echo "- **Green.** Opened/updated bump PR for \`$V\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure separately
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::Compatibility passed, but bump PR publication failed. Inspect the git/gh stderr above; do not classify this as an omp compatibility failure."
          echo "- **Publication failed.** All compatibility gates passed; master is unchanged. Repair repository permissions or PR publication and rerun the probe." >> "$GITHUB_STEP_SUMMARY"

      # A failing candidate files (or refreshes) a tracking issue so the breakage is actionable, and
      # master is never bumped. What changed here is the JOB VERDICT.
      #
      # Before: any incompatible candidate failed the job. Since the probe only ever tested `latest`,
      # and `latest` had moved to a major that breaks our prompt layer, this workflow was red every
      # week for five consecutive runs. A permanently red scheduled job is indistinguishable from a
      # BROKEN scheduled job, so nobody reads it, and the one thing it existed to tell us (a
      # compatible 16.x bump is available) went unsaid for a month.
      #
      # Now: a MAJOR JUMP failing is expected news. It files the issue and the job stays GREEN, so a
      # red X on this workflow means what it should mean, that the probe itself broke or a SAME-MAJOR
      # bump regressed, which is the genuinely alarming case.
      - name: File breakage issue (candidate preparation or compatibility failed)
        id: breakage
        if: failure() && steps.ver.outputs.skip == 'false' && steps.compatible.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.resolved }}"
          JUMP="${{ steps.ver.outputs.major_jump }}"
          KIND=$([ "$JUMP" = "true" ] && echo "major jump" || echo "SAME-MAJOR regression")
          TITLE="omp $V fails the compatibility probe"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXIST=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "Still failing as of run $RUN ($KIND)."
          else
            gh issue create --title "$TITLE" \
              --body "The scheduled omp compatibility probe targeted omp \`$V\` (current pin \`${{ steps.ver.outputs.current }}\`, a $KIND) and candidate preparation or a compatibility check FAILED. **Do not bump until resolved.** Likely seams: compaction/context, eval, thinking, providers. Run: $RUN" \
              --label "bug"
          fi
          echo "- **Failed ($KIND).** Filed/updated a breakage issue for \`$V\`. master left on the safe pin." >> "$GITHUB_STEP_SUMMARY"

      # WHY THIS DOES NOT FLIP THE JOB GREEN. A step cannot un-fail a prior step: once the typecheck
      # above fails, the job is failed, and a later passing step changes nothing. Genuinely reporting an
      # expected major break as green needs `continue-on-error: true` on all nine compatibility steps
      # plus one explicit verdict step, which is surgery on a workflow that cannot be run locally. It is
      # a named follow-up (ADR-0360), NOT done here, and this step deliberately does not pretend
      # otherwise. What it does do is make the run self-describing, so a human seeing the fifth red X
      # in a row learns in one line whether it is expected news or a real alarm.
      - name: Say which kind of failure this was
        if: always() && steps.breakage.outcome == 'success'
        run: |
          if [ "${{ steps.ver.outputs.major_jump }}" = "true" ]; then
            echo "::notice::EXPECTED: omp ${{ steps.ver.outputs.resolved }} is a MAJOR JUMP from ${{ steps.ver.outputs.current }} and is incompatible. Issue filed, master stays on the safe pin. The red X is the known state of the next major, not a new problem."
            echo "- Red X meaning: **expected**. Next-major incompatibility, already tracked. Nothing regressed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::ALARM: omp ${{ steps.ver.outputs.resolved }} is a SAME-MAJOR bump from ${{ steps.ver.outputs.current }} and it FAILED. This is a real regression in a version we could otherwise have adopted."
            echo "- Red X meaning: **alarm**. A same-major bump regressed and needs a look now." >> "$GITHUB_STEP_SUMMARY"
          fi
